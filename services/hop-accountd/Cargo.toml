[package]
name = "hop-accountd"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file = "LICENSE.md"
description = "Hop account/invoice backend: serves the console's native invoice rendering, payment history, and card display from Stripe (the stripe-account-key consumer). Internal, Apache-2.0."

[[bin]]
name = "hop-accountd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Passwordless auth foundation. argon2id is kept for the optional password fallback; the launch path is
# magic-link + OAuth, so the token primitives (CSPRNG + constant-time compare) carry the weight. sha2
# hashes every secret token (login link, session id) at rest, raw values live only in the email/cookie.
argon2 = "0.5"
# PINNED to 0.5 to match argon2 0.5, which is the newest STABLE argon2 (0.6.0-rc.8 is a release
# candidate and not something to adopt for a dependency bump of a password-hashing crate). This crate
# never names password_hash directly; every use is via `argon2::password_hash::`. The dep exists only
# to turn ON the `getrandom` feature of the password-hash that argon2 already pulls, via feature
# unification, which is what makes `rand_core::OsRng` exist at all. Raising it to 0.6 broke that: the
# tree then carried password-hash 0.5 (argon2's, rand_core 0.6, OsRng compiled out) AND 0.6.1
# (rand_core 0.9), and the code straddled both. Bump this only together with argon2.
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = { workspace = true }
# HMAC-SHA256 for verifying Stripe webhook signatures (stripe_webhook.rs). 0.13 pairs with sha2 0.11
# (both on digest 0.11) and is already in the lock via postgres-protocol, so it adds no new crate.
hmac = "0.13"
thiserror = { workspace = true }

# Postgres binding for the console (Cloud SQL). The sync `postgres` client keeps the std-thread server
# style; r2d2 pools connections per instance. These compile with no database present (only running
# queries needs one), so CI type-checks the whole binding and the integration test self-skips when
# HOP_TEST_DATABASE_URL is unset. NoTls is used behind the Cloud SQL Auth Proxy, which terminates TLS.
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"

# The live Stripe read path is behind `live` so the pure request-builders/parsers/routing build and
# test with no network deps (the hop-billingd discipline).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }

# The tenant-registry Firestore projection (fleet sync) reuses the shared TenantRegistry type. Behind
# `firestore` so a default/live build has no Firestore dependency; the projection LOGIC is pure and
# tested under the feature, the periodic writer is live network glue.
hop-store-firestore = { workspace = true, optional = true }

[features]
default = []
live = ["dep:reqwest"]
firestore = ["live", "dep:hop-store-firestore"]

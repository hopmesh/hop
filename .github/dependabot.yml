# Dependabot supply-chain updates for the Hop repo.
#
# Covers all supported package ecosystems across SDKs, applications, tooling,
# and CI workflows. Grouped updates keep PR volume low. The `deny` CI job runs
# cargo-deny (deny.toml) on Cargo dependencies to block Rust advisories, bans,
# and license violations from merging.
version: 2
updates:
  # Rust workspace (single virtual manifest at the repo root).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Fuzzing harnesses (separate Cargo workspace and lockfile).
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Marketing site (Astro / npm).
  - package-ecosystem: npm
    directory: "/apps/web/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns:
          - "*"

  # Node endpoint SDK (koffi bindings over the C ABI).
  - package-ecosystem: npm
    directory: "/sdk/node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-sdk-dependencies:
        patterns:
          - "*"

  # Native artifact provenance signer (@sigstore/sign).
  - package-ecosystem: npm
    directory: "/tools/native-attestation"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # React Native client SDK (npm).
  - package-ecosystem: npm
    directory: "/sdk/react-native"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # React Native demo app (npm).
  - package-ecosystem: npm
    directory: "/apps/react-native/HopDemo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Kotlin SDK wrapper (Gradle).
  #
  # The Kotlin version here is a published-AAR metadata floor, not a latest-is-better
  # dependency: the AAR this module publishes must carry Kotlin metadata the oldest
  # consumer can read (the RN 0.87 app compiles with 2.2.x and cannot read newer).
  # Dependabot bumped it 2.2.10 -> 2.4.10 and broke every React Native Android
  # consumer with "incompatible version of Kotlin" metadata errors. Bump it only in
  # lockstep with the consumer floor, by hand, per the comment in
  # sdk/android/build.gradle.kts.
  - package-ecosystem: gradle
    directory: "/sdk/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "jvm"
      - dependency-name: "org.jetbrains.kotlin*"

  # Android bearer modules (Gradle).
  - package-ecosystem: gradle
    directory: "/bearers/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Android demo app (Gradle).
  - package-ecosystem: gradle
    directory: "/apps/android/HopDemo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Compose Multiplatform SDK (Gradle).
  - package-ecosystem: gradle
    directory: "/sdk/compose"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Android BLE Lab app (Gradle).
  - package-ecosystem: gradle
    directory: "/apps/ble-lab/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Go endpoint SDK (Go modules).
  - package-ecosystem: gomod
    directory: "/sdk/go"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python endpoint SDK (pip / pyproject.toml).
  - package-ecosystem: pip
    directory: "/sdk/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Ruby endpoint SDK (Bundler / Gemfile).
  - package-ecosystem: bundler
    directory: "/sdk/ruby"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Elixir endpoint SDK (Mix / mix.exs).
  - package-ecosystem: mix
    directory: "/sdk/elixir"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Flutter endpoint SDK (Pub / pubspec.yaml).
  - package-ecosystem: pub
    directory: "/sdk/flutter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Apple SwiftPM SDK (SwiftPM / Package.swift).
  - package-ecosystem: swift
    directory: "/sdk/apple"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The CI/pages workflows themselves (action pin drift).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

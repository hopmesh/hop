# Dependabot supply-chain updates for the Hop repo.
#
# Covers every dependency ecosystem the workspace actually uses: the Cargo
# workspace (Rust), the Astro marketing site (npm), the Kotlin SDK wrapper +
# Android modules (Gradle), and the GitHub Actions workflows themselves. Grouped
# updates keep PR volume low; cargo-deny (deny.toml) is the gate that actually
# blocks a bad advisory from merging.
version: 2
updates:
  # Rust workspace (single virtual manifest at the repo root).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Marketing site (Astro / npm).
  - package-ecosystem: npm
    directory: "/apps/web/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns:
          - "*"

  # Node endpoint SDK (koffi bindings over the C ABI).
  - package-ecosystem: npm
    directory: "/sdk/node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-sdk-dependencies:
        patterns:
          - "*"

  # Kotlin SDK wrapper (Gradle).
  #
  # The Kotlin version here is a published-AAR metadata floor, not a latest-is-better
  # dependency: the AAR this module publishes must carry Kotlin metadata the oldest
  # consumer can read (the RN 0.87 app compiles with 2.2.x and cannot read newer).
  # Dependabot bumped it 2.2.10 -> 2.4.10 and broke every React Native Android
  # consumer with "incompatible version of Kotlin" metadata errors. Bump it only in
  # lockstep with the consumer floor, by hand, per the comment in
  # sdk/android/build.gradle.kts.
  - package-ecosystem: gradle
    directory: "/sdk/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "jvm"
      - dependency-name: "org.jetbrains.kotlin*"

  # Android bearer modules (Gradle).
  - package-ecosystem: gradle
    directory: "/bearers/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Android demo app (Gradle).
  - package-ecosystem: gradle
    directory: "/apps/android/HopDemo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The CI/pages workflows themselves (action pin drift).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

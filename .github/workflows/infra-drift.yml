name: Infrastructure drift (hop canonical)

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra-drift.yml
      - tools/secondary-deploy-authority-guard.py
      - tools/secondary-deploy-authority-guard.test.sh
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hop-infra-drift
  cancel-in-progress: false

jobs:
  validate:
    name: Drift workflow authority validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate secondary deployment authority
        run: |
          python3 tools/secondary-deploy-authority-guard.py
          bash tools/secondary-deploy-authority-guard.test.sh

  runtime:
    name: Read-only runtime infrastructure drift
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'hopmesh/hop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DRIFT_WIF_PROVIDER: ${{ vars.GCP_DRIFT_WIF_PROVIDER }}
      DRIFT_SERVICE_ACCOUNT: ${{ vars.GCP_DRIFT_SERVICE_ACCOUNT }}
      RELAYS_ENABLED: ${{ vars.RELAYS_ENABLED }}
      RELAY_IDENTITY_VERSION: ${{ vars.RELAY_IDENTITY_VERSION }}
      EXAMPLE_IDENTITY_VERSION: ${{ vars.EXAMPLE_IDENTITY_VERSION }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      CLOUD_RUN_INGRESS: ${{ vars.CLOUD_RUN_INGRESS }}
      MAX_INSTANCES_PER_REGION: ${{ vars.MAX_INSTANCES_PER_REGION }}
      RELAY_REGION_ALLOWLIST: ${{ vars.RELAY_REGION_ALLOWLIST }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require canonical main and all non-secret inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          for name in PROJECT_ID DRIFT_WIF_PROVIDER DRIFT_SERVICE_ACCOUNT RELAYS_ENABLED \
            RELAY_IDENTITY_VERSION EXAMPLE_IDENTITY_VERSION DEPLOYMENT_ENVIRONMENT \
            CLOUD_RUN_INGRESS MAX_INSTANCES_PER_REGION RELAY_REGION_ALLOWLIST; do
            test -n "${!name}" || { echo "::error::$name is not configured"; exit 1; }
          done

      - name: Authenticate read-only drift identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.DRIFT_WIF_PROVIDER }}
          service_account: ${{ env.DRIFT_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"
          tofu_wrapper: false

      - name: Restore non-secret applied runtime inputs
        working-directory: infra
        run: |
          set -euo pipefail
          tofu init -input=false >"$RUNNER_TEMP/drift-init.log" 2>&1 || {
            echo "::error::runtime drift backend initialization failed"
            exit 1
          }
          tofu output -json drift_inputs > "$RUNNER_TEMP/drift-inputs.json" 2>/dev/null || {
            echo "::error::runtime state has no drift input contract; run canonical runtime deploy"
            exit 1
          }
          python3 - "$RUNNER_TEMP/drift-inputs.json" "$GITHUB_ENV" <<'PY'
          import json, pathlib, sys
          values = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "relay_image", "example_image", "accountd_image", "console_image",
              "deployment_source_sha", "private_source_sha", "billing_price_ids_version",
              "deployment_environment", "relay_identity_version", "example_identity_version",
          }
          if set(values) != expected:
              raise SystemExit("runtime state drift input contract is incomplete")
          output = pathlib.Path(sys.argv[2])
          with output.open("a", encoding="utf-8") as handle:
              for key in sorted(values):
                  handle.write(f"TF_VAR_{key}={json.dumps(values[key], separators=(',', ':'))}\n")
          PY
          {
            echo "TF_VAR_project_id=$PROJECT_ID"
            echo "TF_VAR_deployment_environment=$DEPLOYMENT_ENVIRONMENT"
            echo "TF_VAR_relay_identity_version=$RELAY_IDENTITY_VERSION"
            echo "TF_VAR_example_identity_version=$EXAMPLE_IDENTITY_VERSION"
            echo "TF_VAR_relays_enabled=$RELAYS_ENABLED"
            echo "TF_VAR_cloud_run_ingress=$CLOUD_RUN_INGRESS"
            echo "TF_VAR_max_instances_per_region=$MAX_INSTANCES_PER_REGION"
            echo "TF_VAR_region_allowlist=$RELAY_REGION_ALLOWLIST"
          } >> "$GITHUB_ENV"

      - name: Fail on runtime drift without disclosing private build detail
        working-directory: infra
        run: |
          set -uo pipefail
          tofu plan -input=false -no-color -detailed-exitcode -lock=false -out=drift.tfplan \
            >"$RUNNER_TEMP/runtime-drift.log" 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "runtime infrastructure matches applied configuration"
              ;;
            2)
              tofu show -json drift.tfplan > "$RUNNER_TEMP/runtime-drift.json"
              python3 - "$RUNNER_TEMP/runtime-drift.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          changes = []
          for item in plan.get("resource_changes", []):
              actions = tuple(item.get("change", {}).get("actions", []))
              if actions not in {(), ("no-op",), ("read",)}:
                  changes.append((item.get("address"), actions))
          for address, actions in sorted(changes):
              print(f"{address}: {','.join(actions)}")
          PY
              echo "::error::runtime infrastructure drift detected"
              exit 1
              ;;
            *)
              echo "::error::runtime infrastructure drift check failed; detailed output withheld"
              exit "$rc"
              ;;
          esac

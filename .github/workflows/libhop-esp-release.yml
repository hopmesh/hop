# Build exact ESP32 libhop archives on protected canonical main, then publish those immutable files.
name: libhop ESP32 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create on hopmesh/libhop, in strict vX.Y.Z form
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authorize protected canonical main
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hopmesh/monorepo"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          declared="$(python3 -c 'import re; print(re.search(r"version = \"([^\"]+)\"", open("Cargo.toml").read()).group(1))')"
          test "$VERSION" = "v$declared"
      - name: Install exact ESP Rust toolchain manager and linker
        run: |
          cargo install espup --version 0.17.1 --locked
          cargo install ldproxy --version 0.3.5 --locked
          espup install --targets esp32,esp32c3 \
            --toolchain-version 1.95.0.0 --stable-version 1.95.0 --std
      - name: Build minimal libhop for exact ESP32 targets
        run: |
          set -euo pipefail
          source "$HOME/export-esp.sh"
          release="$RUNNER_TEMP/release"
          mkdir "$release"
          cargo +esp build -p hop --no-default-features --features minimal --release --locked \
            --target xtensa-esp32-espidf -Zbuild-std=std,panic_abort
          cp target/xtensa-esp32-espidf/release/libhop.a "$release/libhop-esp32-xtensa.a"
          cargo +esp build -p hop --no-default-features --features minimal --release --locked \
            --target riscv32imc-esp-espidf -Zbuild-std=std,panic_abort
          cp target/riscv32imc-esp-espidf/release/libhop.a "$release/libhop-esp32-riscv.a"
          cp sdk/hop.h "$release/hop.h"
          test -s "$release/libhop-esp32-xtensa.a"
          test -s "$release/libhop-esp32-riscv.a"
          python3 tools/release-artifact.py create --directory "$release" \
            --canonical-source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify immutable ESP32 release assets
        run: >-
          python3 tools/release-artifact.py verify --directory "$RUNNER_TEMP/release"
          --canonical-source-sha "$GITHUB_SHA"
      - name: Mint libhop-only release token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.HOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.HOP_RELEASE_APP_PRIVATE_KEY }}
          owner: hopmesh
          repositories: libhop
          permission-contents: write
      - name: Publish verified prebuilt archives to hopmesh/libhop
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo hopmesh/libhop \
            --title "$VERSION" \
            --notes "Verified prebuilt libhop for ESP32 Xtensa and RISC-V, produced from hopmesh/monorepo main." \
            "$RUNNER_TEMP/release/hop.h" \
            "$RUNNER_TEMP/release/libhop-esp32-xtensa.a" \
            "$RUNNER_TEMP/release/libhop-esp32-riscv.a" \
            "$RUNNER_TEMP/release/release-manifest.json"

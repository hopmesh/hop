# Mirror any first-party component subtree to its standalone repo (or import a mirror PR back), with
# Copybara (tools/copybara/copy.bara.sky). One dispatch, parameterized by component + direction. This is
# a publish/mirror job, NOT a correctness gate, so it is not in the required-checks allowlist and runs
# only when you trigger it. See tools/copybara/README.md.
#
# Auth is HTTPS + token (no SSH): COPYBARA_TOKEN is a PAT with push access to hopmesh/hop and every
# mirror. We run the Copybara container directly rather than a wrapper action, so the one token covers
# both the git push and the GitHub API (PR creation on import).
name: Sync component

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Mirror repo name (e.g. hop-sdk-node, hop-core, libhop, hop-relayd)"
        required: true
        type: string
      direction:
        description: "export (monorepo -> mirror) or import (mirror PR -> monorepo)"
        type: choice
        options: [export, import]
        default: export
      init_history:
        description: "First export of a component ONLY: seed full history"
        type: boolean
        default: false

# Never let two syncs of the same component run at once (a race would fork the mirror history).
concurrency: sync-${{ github.event.inputs.component }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Copybara replays history, so it needs the whole thing, not a shallow clone.
          fetch-depth: 0

      - name: Configure token auth for git + the GitHub API (HTTPS, no SSH)
        env:
          TOKEN: ${{ secrets.HOP_SYNC_TOKEN }}
        run: |
          git config --global user.name "hop-sync"
          git config --global user.email "sync@hopme.sh"
          # Rewrite github URLs to carry the token inline. Do NOT use credential.helper store: it writes
          # to ~/.git-credentials on use, which fails ("Device or resource busy") when that file is a
          # bind-mounted single file inside the container. insteadOf needs no write.
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Copybara ${{ github.event.inputs.direction }} ${{ github.event.inputs.component }}
        run: |
          INIT=""
          if [ "${{ github.event.inputs.init_history }}" = "true" ]; then INIT="--init-history"; fi
          WORKFLOW="${{ github.event.inputs.component }}_${{ github.event.inputs.direction }}"
          # The image's `copybara` is a wrapper that reads config/workflow/options from env vars, not
          # positionals: `java -jar copybara.jar $COPYBARA_OPTIONS $COPYBARA_SUBCOMMAND $COPYBARA_CONFIG
          # $COPYBARA_WORKFLOW $COPYBARA_SOURCEREF`. Run from the config's folder so the bare filename
          # resolves; git push + the GitHub API both authenticate from the mounted token credentials.
          docker run --rm \
            -v "$PWD":/usr/src/app -w /usr/src/app/tools/copybara \
            -v "$HOME/.gitconfig":/root/.gitconfig \
            -e COPYBARA_SUBCOMMAND=migrate \
            -e COPYBARA_CONFIG=copy.bara.sky \
            -e COPYBARA_WORKFLOW="$WORKFLOW" \
            -e COPYBARA_OPTIONS="--ignore-noop $INIT --force" \
            olivr/copybara copybara

# Mirror any first-party component subtree to its standalone repo (or import a mirror PR back), with
# Copybara (tools/copybara/copy.bara.sky). One dispatch, parameterized by component + direction. This is
# a publish/mirror job, NOT a correctness gate, so it is not in the required-checks allowlist and runs
# only when you trigger it. See tools/copybara/README.md.
name: Sync component

on:
  # Manual only: you pick the component (its mirror repo name) and the direction. Publishing is a human
  # action, so nothing here fires on a push. Use init_history=true for the FIRST export of a component
  # (ITERATIVE mode needs a baseline); leave it false afterward.
  workflow_dispatch:
    inputs:
      component:
        description: "Mirror repo name (e.g. hop-sdk-node, hop-core, libhop, hop-relayd)"
        required: true
        type: string
      direction:
        description: "export (monorepo -> mirror) or import (mirror PR -> monorepo)"
        type: choice
        options: [export, import]
        default: export
      init_history:
        description: "First export of a component ONLY: seed full history"
        type: boolean
        default: false

# Never let two syncs of the same component run at once (a race would fork the mirror history).
concurrency: sync-${{ github.event.inputs.component }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Copybara replays history, so it needs the whole thing, not a shallow clone.
          fetch-depth: 0

      # olivr/copybara-action runs Copybara in a container and wires the git credentials for BOTH repos
      # from access_token. The selected config workflow is "<component>_<direction>" (e.g.
      # hop-sdk-node_export), generated by the loop in copy.bara.sky.
      - name: Copybara ${{ github.event.inputs.direction }} ${{ github.event.inputs.component }}
        uses: olivr/copybara-action@v1.2.4
        with:
          # A PAT / GitHub App token with 'repo' scope on hopmesh/hop AND every mirror. The default
          # GITHUB_TOKEN is scoped to this repo only and cannot push to the mirrors.
          access_token: ${{ secrets.COPYBARA_TOKEN }}
          sot_repo: hopmesh/hop
          destination_repo: hopmesh/${{ github.event.inputs.component }}
          custom_config: tools/copybara/copy.bara.sky
          workflow: ${{ github.event.inputs.component }}_${{ github.event.inputs.direction }}
          # --ignore-noop: a run that changed nothing under the subtree is a clean no-op, not a failure.
          # --init-history (first export only): seed the mirror with the subtree's full history.
          copybara_options: ${{ github.event.inputs.init_history == 'true' && '--ignore-noop --init-history' || '--ignore-noop' }}

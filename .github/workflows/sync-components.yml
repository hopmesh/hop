# Mirror one fixed first-party component subtree to its standalone repository, or import a mirror PR.
# Dispatch values are data only: tools/copybara/dispatch.py maps every accepted choice to fixed paths,
# repository names, workflow names, and Copybara options before either privileged job starts.
name: Sync component

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component mirror"
        required: true
        type: choice
        options:
          - hop-sdk-node
          - hop-sdk-python
          - hop-sdk-go
          - hop-sdk-ruby
          - hop-sdk-crystal
          - hop-sdk-elixir
          - hop-sdk-apple
          - hop-sdk-android
          - hop-embedded
          - hop-core
          - libhop
          - hop-wasm
          - hop-store-sqlite
          - hop-store-firestore
          - hop-bearers-apple
          - hop-bearers-android
          - hop-driver-apple
          - hop-driver-android
          - hop-relayd
          - hop-endpoint
          - hop-gateway
      direction:
        description: "Sync direction"
        type: choice
        options:
          - export
          - import
          - export_pr
        default: export
      init_history:
        description: "Seed full history on the first export only"
        type: boolean
        default: false
      pr_number:
        description: "Source monorepo PR number (required for export_pr; ignored otherwise)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: component-publication
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize canonical protected main
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.context.outputs.source_sha }}
    steps:
      - name: Bind dispatch to the current protected hopmesh/monorepo main commit
        id: context
        env:
          ACTOR: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          expected = "hopmesh/monorepo"
          checks = {
              "repository": os.environ["REPOSITORY"] == expected,
              "event repository": os.environ["EVENT_REPOSITORY"] == expected,
              "event": os.environ["EVENT_NAME"] == "workflow_dispatch",
              "ref": os.environ["REF"] == "refs/heads/main",
              "default branch": os.environ["DEFAULT_BRANCH"] == "main",
              "protected ref": os.environ["REF_PROTECTED"] == "true",
              "same triggering actor": os.environ["ACTOR"] == os.environ["TRIGGERING_ACTOR"],
              "event sender": os.environ["ACTOR"] == os.environ["EVENT_SENDER"],
              "human actor": not os.environ["ACTOR"].endswith("[bot]"),
              "full SHA": re.fullmatch(r"[0-9a-f]{40}", os.environ["SHA"]) is not None,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("sync authority rejected: " + ", ".join(failed))

          request = urllib.request.Request(
              "https://api.github.com/repos/hopmesh/monorepo/git/ref/heads/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "User-Agent": "hop-component-sync",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response).get("object", {}).get("sha", "")
          if current != os.environ["SHA"]:
              raise SystemExit("sync authority rejected: dispatch SHA is not current canonical main")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_sha={current}\n")
          PY

  select:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.map.outputs.repository }}
      workflow: ${{ steps.map.outputs.workflow }}
      copybara_options: ${{ steps.map.outputs.copybara_options }}
      direction: ${{ steps.map.outputs.direction }}
      # export_pr needs the source PR number to reach the copybara container; without this line
      # needs.select.outputs.source_ref is empty and github_pr_origin gets no PR reference.
      source_ref: ${{ steps.map.outputs.source_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Map dispatch to fixed component configuration
        id: map
        env:
          SYNC_COMPONENT: ${{ inputs.component }}
          SYNC_DIRECTION: ${{ inputs.direction }}
          SYNC_INIT_HISTORY: ${{ inputs.init_history }}
          SYNC_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 tools/copybara/dispatch.py

  export:
    needs: [authorize, select]
    if: needs.select.outputs.direction == 'export'
    runs-on: ubuntu-latest
    environment:
      name: component-sync
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Mint destination-only mirror token
        id: mirror-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOP_SYNC_APP_ID }}
          private-key: ${{ secrets.HOP_SYNC_APP_PRIVATE_KEY }}
          owner: hopmesh
          repositories: ${{ needs.select.outputs.repository }}
          permission-contents: write
          # The mirror carries its own .github/workflows (ci.yml, release.yml, sync-back.yml, cla.yml)
          # that copy.bara.sky manages, and GitHub refuses to let an App create/update a workflow file
          # without this scope ("refusing to allow a GitHub App to create or update workflow ...
          # without `workflows` permission"). The App must also be granted Workflows: read/write.
          permission-workflows: write
      - name: Export selected component with isolated Copybara
        env:
          SOURCE_TOKEN: ${{ github.token }}
          DESTINATION_TOKEN: ${{ steps.mirror-token.outputs.token }}
          DESTINATION_REPOSITORY: ${{ needs.select.outputs.repository }}
          COPYBARA_WORKFLOW: ${{ needs.select.outputs.workflow }}
          COPYBARA_OPTIONS: ${{ needs.select.outputs.copybara_options }}
        run: |
          set -euo pipefail
          umask 077
          gitconfig="$(mktemp "$RUNNER_TEMP/copybara-gitconfig.XXXXXX")"
          cleanup() { rm -f "$gitconfig"; }
          trap cleanup EXIT
          # Authenticate git by rewriting the canonical https URLs to carry the per-repo token
          # (url.insteadOf), NOT a credential.helper store. The store helper writes a lock file on
          # `credential approve` after a push, and every writable path in this hardened container is
          # read-only, so the push died "unable to get credential storage lock: Read-only file system".
          # insteadOf needs no helper and no writable state. The tokens are Actions secrets
          # (github.token + the App token), so they are masked if they ever surface in a log line. 644
          # because the container runs as a non-root user whose UID does not match the runner's; the
          # file lives only on the ephemeral runner and is removed on exit.
          cat > "$gitconfig" <<CONFIG
          [url "https://x-access-token:${SOURCE_TOKEN}@github.com/hopmesh/monorepo"]
              insteadOf = https://github.com/hopmesh/monorepo
          [url "https://x-access-token:${DESTINATION_TOKEN}@github.com/hopmesh/${DESTINATION_REPOSITORY}"]
              insteadOf = https://github.com/hopmesh/${DESTINATION_REPOSITORY}
          [user]
              name = hop-sync
              email = sync@hopme.sh
          CONFIG
          chmod 644 "$gitconfig"
          set +e
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=1g --tmpfs /root:rw,nosuid,size=1g \
            -v "$PWD/tools/copybara/copy.bara.sky:/usr/src/app/copy.bara.sky:ro" \
            -v "$gitconfig:/etc/gitconfig:ro" \
            -w /usr/src/app -e HOME=/root -e GIT_CONFIG_GLOBAL=/etc/gitconfig \
            -e COPYBARA_SUBCOMMAND=migrate -e COPYBARA_CONFIG=copy.bara.sky \
            -e COPYBARA_WORKFLOW -e COPYBARA_OPTIONS \
            olivr/copybara:20230129@sha256:87e2e9089344e64693faebb2ee0ed33b8797358c0420b0fa98325ca611e98679 copybara
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "synced: changes migrated to the mirror"
          elif [ "$rc" -eq 4 ]; then
            echo "no-op: mirror already up to date"
          else
            echo "::error::copybara exited $rc"
            exit "$rc"
          fi

  export_pr:
    needs: [authorize, select]
    if: needs.select.outputs.direction == 'export_pr'
    runs-on: ubuntu-latest
    environment:
      name: component-sync
    # github.token only READS the open monorepo PR (source). The mirror PR (destination) is written by
    # the minted App token below, so github.token needs no write here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Mint destination-mirror PR token
        id: mirror-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOP_SYNC_APP_ID }}
          private-key: ${{ secrets.HOP_SYNC_APP_PRIVATE_KEY }}
          owner: hopmesh
          repositories: ${{ needs.select.outputs.repository }}
          # Writes a branch + opens/updates a PR on the mirror; the PR may carry the mirror's own
          # .github/workflows, so it needs Workflows write like the export push does.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Mirror the open monorepo PR to the component with isolated Copybara
        env:
          SOURCE_TOKEN: ${{ github.token }}
          DESTINATION_TOKEN: ${{ steps.mirror-token.outputs.token }}
          DESTINATION_REPOSITORY: ${{ needs.select.outputs.repository }}
          COPYBARA_WORKFLOW: ${{ needs.select.outputs.workflow }}
          COPYBARA_OPTIONS: ${{ needs.select.outputs.copybara_options }}
          # The source monorepo PR number. The olivr wrapper appends COPYBARA_SOURCEREF as the last
          # copybara arg (after the workflow), which is exactly where github_pr_origin wants the
          # positional PR reference. Sanitized to a bare integer by dispatch.py, and surfaced as a
          # select job output (below) so this reference resolves to the number rather than empty.
          COPYBARA_SOURCEREF: ${{ needs.select.outputs.source_ref }}
        run: |
          set -euo pipefail
          umask 077
          gitconfig="$(mktemp "$RUNNER_TEMP/copybara-gitconfig.XXXXXX")"
          gitcreds="$(mktemp "$RUNNER_TEMP/copybara-gitcreds.XXXXXX")"
          cleanup() { rm -f "$gitconfig" "$gitcreds"; }
          trap cleanup EXIT
          # Two auth surfaces, both per-repo. (1) git TRANSPORT (clone monorepo, push mirror) carries
          # the token in the URL via url.insteadOf. (2) copybara's GitHub API client (github_pr_origin
          # reads the PRIVATE monorepo PR, github_pr_destination opens the mirror PR) resolves a token
          # via `git credential fill`, so it needs a helper. We point it at a read-only store file with
          # useHttpPath, so each repo path draws its own token: monorepo -> source (github.token),
          # mirror -> destination (App). Only `fill` (read) runs here, so the read-only store is never
          # written (no approve/erase, no lock). See the export step for the transport rationale.
          cat > "$gitconfig" <<CONFIG
          [url "https://x-access-token:${SOURCE_TOKEN}@github.com/hopmesh/monorepo"]
              insteadOf = https://github.com/hopmesh/monorepo
          [url "https://x-access-token:${DESTINATION_TOKEN}@github.com/hopmesh/${DESTINATION_REPOSITORY}"]
              insteadOf = https://github.com/hopmesh/${DESTINATION_REPOSITORY}
          [credential]
              helper = store --file=/etc/hop-git-credentials
              useHttpPath = true
          [user]
              name = hop-sync
              email = sync@hopme.sh
          CONFIG
          chmod 644 "$gitconfig"
          # Per-repo API tokens for `git credential fill` (copybara's GitHub API client). Both the bare
          # and .git path forms, since the web URL copybara authenticates against may or may not carry
          # the .git suffix. Written with printf so no heredoc indentation leaks into the credential
          # lines (git-credential-store does not tolerate leading whitespace). World readable to match
          # gitconfig; same tokens, single-tenant ephemeral runner.
          {
            printf 'https://x-access-token:%s@github.com/hopmesh/monorepo\n' "$SOURCE_TOKEN"
            printf 'https://x-access-token:%s@github.com/hopmesh/monorepo.git\n' "$SOURCE_TOKEN"
            printf 'https://x-access-token:%s@github.com/hopmesh/%s\n' "$DESTINATION_TOKEN" "$DESTINATION_REPOSITORY"
            printf 'https://x-access-token:%s@github.com/hopmesh/%s.git\n' "$DESTINATION_TOKEN" "$DESTINATION_REPOSITORY"
          } > "$gitcreds"
          chmod 644 "$gitcreds"
          set +e
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=1g --tmpfs /root:rw,nosuid,size=1g \
            -v "$PWD/tools/copybara/copy.bara.sky:/usr/src/app/copy.bara.sky:ro" \
            -v "$gitconfig:/etc/gitconfig:ro" \
            -v "$gitcreds:/etc/hop-git-credentials:ro" \
            -w /usr/src/app -e HOME=/root -e GIT_CONFIG_GLOBAL=/etc/gitconfig \
            -e COPYBARA_SUBCOMMAND=migrate -e COPYBARA_CONFIG=copy.bara.sky \
            -e COPYBARA_WORKFLOW -e COPYBARA_OPTIONS -e COPYBARA_SOURCEREF \
            olivr/copybara:20230129@sha256:87e2e9089344e64693faebb2ee0ed33b8797358c0420b0fa98325ca611e98679 copybara
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "synced: open monorepo PR mirrored to hopmesh/$DESTINATION_REPOSITORY"
          elif [ "$rc" -eq 4 ]; then
            echo "no-op: no open monorepo PR touches this component (nothing to mirror)"
          else
            echo "::error::copybara exited $rc"
            exit "$rc"
          fi

  import:
    needs: [authorize, select]
    if: needs.select.outputs.direction == 'import'
    runs-on: ubuntu-latest
    environment:
      name: component-sync
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Mint source-mirror read token
        id: mirror-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOP_SYNC_APP_ID }}
          private-key: ${{ secrets.HOP_SYNC_APP_PRIVATE_KEY }}
          owner: hopmesh
          repositories: ${{ needs.select.outputs.repository }}
          permission-contents: read
          permission-pull-requests: read
      - name: Import selected component with isolated Copybara
        env:
          SOURCE_TOKEN: ${{ steps.mirror-token.outputs.token }}
          DESTINATION_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ needs.select.outputs.repository }}
          COPYBARA_WORKFLOW: ${{ needs.select.outputs.workflow }}
          COPYBARA_OPTIONS: ${{ needs.select.outputs.copybara_options }}
        run: |
          set -euo pipefail
          umask 077
          gitconfig="$(mktemp "$RUNNER_TEMP/copybara-gitconfig.XXXXXX")"
          cleanup() { rm -f "$gitconfig"; }
          trap cleanup EXIT
          # Authenticate git by rewriting the canonical https URLs to carry the per-repo token
          # (url.insteadOf), NOT a credential.helper store: the store helper needs a writable path for
          # its lock on `credential approve`, and this hardened container is read-only. See the export
          # step for the full rationale. Import reads the mirror (App token) and pushes a PR branch to
          # the monorepo (github.token).
          cat > "$gitconfig" <<CONFIG
          [url "https://x-access-token:${SOURCE_TOKEN}@github.com/hopmesh/${SOURCE_REPOSITORY}"]
              insteadOf = https://github.com/hopmesh/${SOURCE_REPOSITORY}
          [url "https://x-access-token:${DESTINATION_TOKEN}@github.com/hopmesh/monorepo"]
              insteadOf = https://github.com/hopmesh/monorepo
          [user]
              name = hop-sync
              email = sync@hopme.sh
          CONFIG
          chmod 644 "$gitconfig"
          set +e
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=1g --tmpfs /root:rw,nosuid,size=1g \
            -v "$PWD/tools/copybara/copy.bara.sky:/usr/src/app/copy.bara.sky:ro" \
            -v "$gitconfig:/etc/gitconfig:ro" \
            -w /usr/src/app -e HOME=/root -e GIT_CONFIG_GLOBAL=/etc/gitconfig \
            -e COPYBARA_SUBCOMMAND=migrate -e COPYBARA_CONFIG=copy.bara.sky \
            -e COPYBARA_WORKFLOW -e COPYBARA_OPTIONS \
            olivr/copybara:20230129@sha256:87e2e9089344e64693faebb2ee0ed33b8797358c0420b0fa98325ca611e98679 copybara
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "synced: changes migrated to hopmesh/monorepo"
          elif [ "$rc" -eq 4 ]; then
            echo "no-op: canonical repository already up to date"
          else
            echo "::error::copybara exited $rc"
            exit "$rc"
          fi

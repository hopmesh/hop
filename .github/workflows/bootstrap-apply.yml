name: Bootstrap authority (hop canonical)

on:
  pull_request:
    paths:
      - infra/bootstrap/**
      - .github/workflows/bootstrap-apply.yml
      - tools/infra-authority-guard.py
      - tools/infra-authority-guard.test.sh
      - tools/secondary-deploy-authority-guard.py
      - tools/secondary-deploy-authority-guard.test.sh
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, apply hop-only authority, or roll back to platform plus hop
        required: true
        type: choice
        options: [plan, apply, rollback]
      confirm:
        description: Type bootstrap hopmesh/hop main, or rollback hop authority to platform
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: hop-bootstrap-authority
  cancel-in-progress: false

jobs:
  validate:
    name: Bootstrap deployment authority validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"
          tofu_wrapper: false
      - name: Validate bootstrap source and authority guards
        run: |
          tofu -chdir=infra/bootstrap fmt -check -recursive
          tofu -chdir=infra/bootstrap init -backend=false -input=false
          tofu -chdir=infra/bootstrap validate
          python3 tools/infra-authority-guard.py
          bash tools/infra-authority-guard.test.sh
          python3 tools/secondary-deploy-authority-guard.py
          bash tools/secondary-deploy-authority-guard.test.sh

  bootstrap:
    name: Plan or apply canonical hop authority
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'hopmesh/hop' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.operation != 'rollback' && inputs.confirm == 'bootstrap hopmesh/hop main') ||
       (inputs.operation == 'rollback' && inputs.confirm == 'rollback hop authority to platform'))
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BOOTSTRAP_WIF_PROVIDER: ${{ vars.GCP_BOOTSTRAP_WIF_PROVIDER }}
      BOOTSTRAP_SERVICE_ACCOUNT: ${{ vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      BILLING_SERVICE_ACCOUNT: ${{ vars.GCP_BILLING_SERVICE_ACCOUNT }}
      RELAYS_ENABLED: ${{ vars.RELAYS_ENABLED }}
      RELAY_IDENTITY_VERSION: ${{ vars.RELAY_IDENTITY_VERSION }}
      EXAMPLE_IDENTITY_VERSION: ${{ vars.EXAMPLE_IDENTITY_VERSION }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      CLOUD_RUN_INGRESS: ${{ vars.CLOUD_RUN_INGRESS }}
      MAX_INSTANCES_PER_REGION: ${{ vars.MAX_INSTANCES_PER_REGION }}
      RELAY_REGION_ALLOWLIST: ${{ vars.RELAY_REGION_ALLOWLIST }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require canonical main and every non-secret input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          for name in PROJECT_ID BOOTSTRAP_WIF_PROVIDER BOOTSTRAP_SERVICE_ACCOUNT \
            RUNTIME_SERVICE_ACCOUNT BILLING_SERVICE_ACCOUNT RELAYS_ENABLED RELAY_IDENTITY_VERSION \
            EXAMPLE_IDENTITY_VERSION DEPLOYMENT_ENVIRONMENT CLOUD_RUN_INGRESS \
            MAX_INSTANCES_PER_REGION RELAY_REGION_ALLOWLIST; do
            test -n "${!name}" || { echo "::error::$name is not configured"; exit 1; }
          done
          test "$OPERATION" = plan -o "$OPERATION" = apply -o "$OPERATION" = rollback

      - name: Authenticate bootstrap authority
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.BOOTSTRAP_WIF_PROVIDER }}
          service_account: ${{ env.BOOTSTRAP_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"
          tofu_wrapper: false

      - name: Materialize reviewed non-secret bootstrap inputs
        working-directory: infra/bootstrap
        run: |
          set -euo pipefail
          phase=hop
          if [ "$OPERATION" = rollback ]; then phase=handoff; fi
          cat > ci.auto.tfvars <<EOF
          github_repository        = "hopmesh/hop"
          github_authority_phase   = "$phase"
          runtime_state_bucket     = "hop-mesh-tfstate"
          runtime_state_prefix     = "relay-fleet"
          relay_identity_version   = "$RELAY_IDENTITY_VERSION"
          example_identity_version = "$EXAMPLE_IDENTITY_VERSION"
          deployment_environment   = "$DEPLOYMENT_ENVIRONMENT"
          relays_enabled           = $RELAYS_ENABLED
          cloud_run_ingress        = "$CLOUD_RUN_INGRESS"
          max_instances_per_region = $MAX_INSTANCES_PER_REGION
          region_allowlist         = $RELAY_REGION_ALLOWLIST
          relay_domain             = "relay.hopme.sh"
          EOF
          chmod 600 ci.auto.tfvars

      - name: Prove WIF authentication before state access
        run: |
          gcloud auth print-access-token >/dev/null 2>/tmp/auth-error || {
            echo "::error::bootstrap WIF authentication failed"
            cat /tmp/auth-error
            exit 1
          }

      - name: Create and inspect one saved bootstrap plan
        working-directory: infra/bootstrap
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu plan -input=false -no-color -out=tfplan
          tofu show -json tfplan > "$RUNNER_TEMP/bootstrap-plan.json"

      - name: Refuse unrelated bootstrap actions
        run: |
          python3 - "$RUNNER_TEMP/bootstrap-plan.json" "$OPERATION" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          operation = sys.argv[2]
          mutable = {
              "google_iam_workload_identity_pool_provider.github",
              "google_service_account_iam_member.deploy_runtime_wif",
              "google_service_account_iam_member.bootstrap_apply_wif",
              "google_service_account_iam_member.billing_catalog_wif_main",
              "google_secret_manager_secret.billing_price_ids",
              "google_secret_manager_secret_iam_member.billing_catalog_price_ids_writer",
              "google_secret_manager_secret_iam_member.deploy_billing_price_ids_accessor",
              "google_secret_manager_secret_iam_member.deploy_billing_price_ids_viewer",
              "google_storage_bucket_iam_member.deploy_billing_state_reader",
          }
          allowed = {(), ("no-op",), ("read",), ("create",), ("update",)}
          bad = []
          for item in plan.get("resource_changes", []):
              address = item.get("address")
              change = item.get("change", {})
              actions = tuple(change.get("actions", []))
              previous = item.get("previous_address")
              if previous is not None:
                  bad.append((address, "moved", previous))
                  continue
              if actions == ("delete",) and address == "google_storage_bucket_iam_member.deploy_billing_state_reader" and operation != "rollback":
                  continue
              if actions not in allowed:
                  bad.append((address, actions))
              elif actions not in ((), ("no-op",), ("read",)) and address not in mutable:
                  bad.append((address, actions))
          if bad:
              raise SystemExit(f"bootstrap plan contains unapproved actions: {bad}")
          PY

      - id: apply
        name: Apply the saved bootstrap plan
        if: env.OPERATION == 'apply' || env.OPERATION == 'rollback'
        working-directory: infra/bootstrap
        run: |
          set -euo pipefail
          tofu apply -input=false -auto-approve -no-color tfplan
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Prove final or rollback authority state
        if: steps.apply.outputs.applied == 'true'
        run: |
          set -euo pipefail
          gcloud iam workload-identity-pools providers describe github \
            --project "$PROJECT_ID" --location global --workload-identity-pool github-actions \
            --format=json > "$RUNNER_TEMP/provider.json"
          for item in \
            "$RUNTIME_SERVICE_ACCOUNT:runtime" \
            "$BOOTSTRAP_SERVICE_ACCOUNT:bootstrap" \
            "$BILLING_SERVICE_ACCOUNT:billing"; do
            account="${item%%:*}"; label="${item##*:}"
            gcloud iam service-accounts get-iam-policy "$account" --format=json > "$RUNNER_TEMP/${label}-iam.json"
          done
          python3 - "$RUNNER_TEMP" "$OPERATION" "$PROJECT_ID" <<'PY'
          import json, pathlib, sys
          root, operation, project = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          provider = json.load(open(root / "provider.json", encoding="utf-8"))
          final = 'assertion.repository == "hopmesh/hop"'
          rollback = 'assertion.repository == "hopmesh/platform" || assertion.repository == "hopmesh/hop"'
          expected = rollback if operation == "rollback" else final
          if provider.get("attributeCondition") != expected or provider.get("state") != "ACTIVE":
              raise SystemExit("live WIF provider condition/state does not match the requested authority phase")
          oidc = provider.get("oidc", {})
          if oidc.get("issuerUri") != "https://token.actions.githubusercontent.com" or oidc.get("jwksJson") or oidc.get("allowedAudiences"):
              raise SystemExit("live WIF provider OIDC verification settings drifted")
          wanted = f"principalSet://iam.googleapis.com/projects/149923095434/locations/global/workloadIdentityPools/github-actions/attribute.ref/refs/heads/main"
          risky = {"roles/iam.workloadIdentityUser", "roles/iam.serviceAccountTokenCreator", "roles/iam.serviceAccountOpenIdTokenCreator"}
          for label in ("runtime", "bootstrap", "billing"):
              policy = json.load(open(root / f"{label}-iam.json", encoding="utf-8"))
              found = [(b.get("role"), member) for b in policy.get("bindings", []) for member in b.get("members", []) if b.get("role") in risky]
              if found != [("roles/iam.workloadIdentityUser", wanted)]:
                  raise SystemExit(f"{label} live auth grants drifted")
          print(f"verified live authority phase {operation}")
          PY

      - name: Report plan-only result
        if: env.OPERATION == 'plan'
        run: echo "Bootstrap plan validated; no authority changed."

# Apply the administrator-owned bootstrap root (infra/bootstrap) via CI/CD, never a local tofu run.
#
# A local `tofu apply` against this GCS-backed root is a destroy operation whenever the operator's
# checkout is behind: anything in remote state but absent from the local files is planned for deletion,
# and this root owns IAM, service accounts, secrets, and KMS keys. `prevent_destroy` converts that into
# a half-applied root rather than a safe refusal. This workflow always applies the exact bytes of a
# reviewed commit instead.
#
# - PR touching infra/bootstrap/**: credential-free fmt, validate, and the authority guards.
# - workflow_dispatch confirm=plan:  a real plan against live bootstrap state.
# - workflow_dispatch confirm=seed:  one-time state imports for out-of-band created resources, then plan.
# - workflow_dispatch confirm=apply: reviewer-gated apply.
#
# Auth is keyless: GitHub OIDC -> Workload Identity Federation -> the bootstrap-apply service account
# (infra/bootstrap/ci_apply.tf). That account is a project IAM administrator, because that is what
# applying this root requires, so its two OIDC bindings are exact subjects: the plan job may run only
# from refs/heads/main, and the apply job only through the bootstrap-apply GitHub environment. A pull
# request ref can therefore mint NO credentials here at all, which is why the PR path is static.
#
# The job stays neutral until both repository variables are populated from the reviewed bootstrap
# outputs (bootstrap_wif_provider, bootstrap_wif_service_account).
name: Bootstrap root (infra/bootstrap)

on:
  pull_request:
    paths: ["infra/bootstrap/**", ".github/workflows/bootstrap-apply.yml"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "plan, seed (one-time state imports, then plan), or apply"
        required: true
        default: "plan"
        type: choice
        options: ["plan", "seed", "apply"]

permissions:
  contents: read
  id-token: write # required for the WIF OIDC token exchange

concurrency: bootstrap-root # never two bootstrap runs at once

jobs:
  # Runs on every PR and before every dispatch. Needs no cloud credentials, so it is safe on a PR ref.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"

      - name: tofu fmt (check)
        working-directory: infra/bootstrap
        run: tofu fmt -check -recursive

      - name: tofu init (no backend) + validate
        working-directory: infra/bootstrap
        run: |
          tofu init -backend=false -input=false
          tofu validate

      - name: Runtime/bootstrap authority boundary
        run: python3 tools/infra-authority-guard.py

      - name: Required-check allowlist is in sync
        run: bash tools/check-required-checks.sh

  # A real plan against live state. Dispatch only: the OIDC subject bound to this identity is
  # refs/heads/main, so nothing here is reachable from a pull request.
  plan:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.GCP_BOOTSTRAP_WIF_PROVIDER != '' &&
      vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/bootstrap
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: hop-mesh
          workload_identity_provider: ${{ vars.GCP_BOOTSTRAP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"

      # The external tfvars carry immutable GitHub ids, pinned secret versions, bucket names, and the
      # approver group. They are never committed; infra/.gitignore already ignores *.auto.tfvars.
      - name: materialize bootstrap tfvars
        env:
          BOOTSTRAP_TFVARS: ${{ secrets.BOOTSTRAP_TFVARS }}
        run: |
          test -n "$BOOTSTRAP_TFVARS" || { echo "BOOTSTRAP_TFVARS secret is empty" >&2; exit 1; }
          printf '%s\n' "$BOOTSTRAP_TFVARS" > ci.auto.tfvars

      - name: tofu init
        run: tofu init -input=false

      # One-time only. Resources created out of band (the bootstrap-apply identity itself cannot be
      # created by the workflow that authenticates as it) are create-only, so an unimported one fails
      # the apply with alreadyExists. Additive IAM bindings need no import. Import is not apply: it
      # writes state, it never deletes a remote object.
      - name: tofu import (seed only)
        if: github.event.inputs.confirm == 'seed'
        run: |
          # Both are create-only and both are seeded out of band: the identity cannot create itself,
          # and the custom role carrying its secret-container permissions must exist BEFORE the first
          # apply, or that apply manages the 6 secret containers with a permission it is granting
          # itself in the same run and fails 403 while the binding propagates.
          import_once() {
            if tofu state list | grep -Fxq "$1"; then
              echo "$1 already tracked, skipping import"
            else
              tofu import -input=false "$1" "$2"
            fi
          }
          import_once "google_service_account.bootstrap_apply" \
            "projects/hop-mesh/serviceAccounts/bootstrap-apply@hop-mesh.iam.gserviceaccount.com"
          import_once "google_project_iam_custom_role.bootstrap_apply_secrets" \
            "projects/hop-mesh/roles/hopBootstrapApplySecrets"

      - name: tofu plan
        run: tofu plan -input=false -no-color

  # Applying this root is administrative. It is gated by the bootstrap-apply GitHub environment, whose
  # required reviewers and deployment-branch policy are repository settings a human configures once.
  # The environment is also load bearing for auth: it changes the OIDC subject to the environment form,
  # which is the only subject bound for this step.
  apply:
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm == 'apply' &&
      vars.GCP_BOOTSTRAP_WIF_PROVIDER != '' &&
      vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    environment: bootstrap-apply
    defaults:
      run:
        working-directory: infra/bootstrap
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: hop-mesh
          workload_identity_provider: ${{ vars.GCP_BOOTSTRAP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"

      - name: materialize bootstrap tfvars
        env:
          BOOTSTRAP_TFVARS: ${{ secrets.BOOTSTRAP_TFVARS }}
        run: |
          test -n "$BOOTSTRAP_TFVARS" || { echo "BOOTSTRAP_TFVARS secret is empty" >&2; exit 1; }
          printf '%s\n' "$BOOTSTRAP_TFVARS" > ci.auto.tfvars

      - name: tofu init
        run: tofu init -input=false

      - name: tofu apply
        run: tofu apply -input=false -auto-approve -no-color

      - name: bootstrap outputs (wire these into repository variables)
        run: |
          echo "billing WIF provider:  $(tofu output -raw github_wif_provider)"
          echo "billing service acct:  $(tofu output -raw github_wif_service_account)"
          echo "bootstrap WIF provider: $(tofu output -raw bootstrap_wif_provider)"
          echo "bootstrap service acct: $(tofu output -raw bootstrap_wif_service_account)"

name: Deploy marketing site (Pages)

# Build the Astro marketing site in web/ and publish it to GitHub Pages.
# Pages must be enabled with "Source: GitHub Actions" once in repo settings
# (Settings → Pages). The custom domain hopme.sh is carried by web/public/CNAME.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sim/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web-05 / simwasm-02: rebuild the sim wasm FROM SOURCE (core/hop-wasm at HEAD) before the Astro
      # build, so what deploys to hopme.sh always matches the shipping core. The committed sim/pkg is a
      # convenience for local builds without a wasm toolchain; the public site is built from source.
      - name: Install Rust + wasm32 target
        working-directory: .
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        working-directory: .
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build sim wasm (browser + node) from core/hop-wasm
        working-directory: .
        run: bash sim/build-wasm.sh

      # infra-r2-01: gate the PUBLISH on the same guards the CI `web` job runs, so hopme.sh can't ship
      # a stale/broken sim or a dead internal link even though pages.yml rebuilds independently on the
      # main push. These run BEFORE upload, so a failure blocks the deploy job (needs: build).

      # sim/pkg must still match a fresh build from core (no stale committed artifact on the live site).
      - name: Guard sim/pkg against drift from core
        working-directory: .
        run: bash sim/check-pkg-fresh.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Every homepage scenario must actually complete (each scripted send delivers AND its ACK returns).
      # After setup-node so it runs on the pinned Node 20, against the pkg-node just built above.
      - name: Sim scenario-check (all scenarios complete)
        working-directory: .
        run: node sim/scenario-check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # prebuild runs `npm run sync`, which copies the freshly-built ../sim (incl. sim/pkg) into public/.
      - name: Build
        run: npm run build

      # infra-r2-01: dead-internal-link gate over the built site, same as the CI `web` job. Blocks the
      # publish on a broken link instead of shipping it live.
      - name: Internal link check (web/dist)
        working-directory: .
        run: node tools/check-web-links.mjs web/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

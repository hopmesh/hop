name: Crates Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (package and validate metadata without uploading)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CRATES_IO_TOKEN presence
        env:
          CRATES_IO_TOKEN_SET: ${{ secrets.CRATES_IO_TOKEN != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$CRATES_IO_TOKEN_SET" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error :: CRATES_IO_TOKEN is not provisioned in the release environment; cannot publish crates to crates.io"
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Dry run crate packaging and metadata
        run: |
          python3 tools/crates-publish.py dry-run --output-dir /tmp/crates-dry-run

      - name: Publish verified crates
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          python3 tools/crates-publish.py publish-all --crates-dir /tmp/crates-dry-run

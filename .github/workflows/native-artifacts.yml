name: Native artifacts
run-name: Native artifacts for ${{ github.sha }}

on:
  push:
    branches: [main]

concurrency:
  group: native-artifacts-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.97.0'

jobs:
  authorize:
    name: Authorize canonical source
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'hopmesh/hop'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Bind source identity
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_AFTER: ${{ github.event.after }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$EVENT_AFTER"
          test "$SOURCE_REF" = "refs/heads/main"
          test "$SOURCE_REPOSITORY" = "hopmesh/hop"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  host-linux:
    name: Build Linux host artifact
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Build and package Linux libhop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build -p hop --release --locked --target "$TARGET"
          stage="$RUNNER_TEMP/$TARGET"
          mkdir -p "$stage/lib" "$stage/include" "$RUNNER_TEMP/out"
          cp "target/$TARGET/release/libhop.so" "$stage/lib/libhop.so"
          cp sdk/hop.h "$stage/include/hop.h"
          python3 tools/native-artifacts.py pack --root "$stage" --format tar.gz \
            --output "$RUNNER_TEMP/out/libhop-$TARGET.tar.gz"
      - name: Upload immutable Linux partial
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-${{ matrix.target }}-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30

  apple:
    name: Build Apple host and xcframework artifacts
    needs: authorize
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 16.2
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Build exact Apple artifacts
        env:
          HOP_SQLCIPHER: '0'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/out"
          bash sdk/apple/build-xcframework.sh
          apple_stage="$RUNNER_TEMP/apple-xcframework"
          mkdir "$apple_stage"
          cp -R sdk/apple/Frameworks/libhop.xcframework "$apple_stage/libhop.xcframework"
          python3 tools/native-artifacts.py pack --root "$apple_stage" --path libhop.xcframework \
            --format zip --output "$RUNNER_TEMP/out/libhop.xcframework.zip"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p hop --release --locked --target "$target"
            stage="$RUNNER_TEMP/$target"
            mkdir -p "$stage/lib" "$stage/include"
            cp "target/$target/release/libhop.dylib" "$stage/lib/libhop.dylib"
            cp sdk/hop.h "$stage/include/hop.h"
            python3 tools/native-artifacts.py pack --root "$stage" --format tar.gz \
              --output "$RUNNER_TEMP/out/libhop-$target.tar.gz"
          done
      - name: Upload immutable Apple partials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-apple-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android ABI artifacts
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install exact NDK and Rust builders
        run: |
          sdkmanager "ndk;26.3.11579264"
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android --toolchain 1.97.0
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Invoke the canonical Android native builder
        env:
          HOP_ANDROID_OUT: ${{ runner.temp }}/android-generated
          HOP_SQLCIPHER: '0'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash tools/build-aar.sh
      - name: Package each exact Android target
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/out"
          for mapping in \
            arm64-v8a=aarch64-linux-android \
            armeabi-v7a=armv7-linux-androideabi \
            x86=i686-linux-android \
            x86_64=x86_64-linux-android; do
            abi="${mapping%%=*}"
            target="${mapping#*=}"
            stage="$RUNNER_TEMP/$target"
            mkdir -p "$stage/lib" "$stage/include"
            cp "$RUNNER_TEMP/android-generated/jniLibs/$abi/libhop.so" "$stage/lib/libhop.so"
            cp sdk/hop.h "$stage/include/hop.h"
            case "$target" in
              aarch64-linux-android) machine='AArch64' ;;
              armv7-linux-androideabi) machine='ARM' ;;
              i686-linux-android) machine='Intel 80386' ;;
              x86_64-linux-android) machine='Advanced Micro Devices X86-64' ;;
              *) exit 1 ;;
            esac
            readelf -h "$stage/lib/libhop.so" | grep -Eq "Machine:[[:space:]]+$machine$"
            python3 tools/native-artifacts.py pack --root "$stage" --format tar.gz \
              --output "$RUNNER_TEMP/out/libhop-$target.tar.gz"
          done
      - name: Upload immutable Android partials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-android-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30

  embedded:
    name: Build exact ESP-IDF target artifacts
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Install pinned ESP Rust toolchain manager and linker proxy
        run: |
          cargo install espup --version 0.17.1 --locked
          cargo install ldproxy --version 0.3.5 --locked
          espup install --targets esp32,esp32s2,esp32s3,esp32c3,esp32c6,esp32h2 \
            --toolchain-version 1.95.0.0 --stable-version 1.95.0 --std
      - name: Build and package each exact embedded target
        run: |
          set -euo pipefail
          source "$HOME/export-esp.sh"
          mkdir "$RUNNER_TEMP/out"
          for target in \
            xtensa-esp32-espidf \
            xtensa-esp32s2-espidf \
            xtensa-esp32s3-espidf \
            riscv32imc-esp-espidf \
            riscv32imac-esp-espidf; do
            cargo +esp build -p hop --no-default-features --features minimal \
              --target "$target" --release --locked -Zbuild-std=std,panic_abort
            stage="$RUNNER_TEMP/$target"
            mkdir -p "$stage/lib" "$stage/include"
            cp "target/$target/release/libhop.a" "$stage/lib/libhop.a"
            cp sdk/hop.h "$stage/include/hop.h"
            python3 tools/native-artifacts.py pack --root "$stage" --format tar.gz \
              --output "$RUNNER_TEMP/out/libhop-$target.tar.gz"
          done
      - name: Upload immutable embedded partials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-embedded-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30

  authorize-ci:
    name: Authorize successful canonical CI
    needs: [authorize, host-linux, apple, android, embedded]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Require the successful CI gate for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: python3 tools/native-artifacts.py authorize-ci --source-sha "$SOURCE_SHA"

  attest:
    name: Sign and attest native release bundle
    needs: [authorize, host-linux, apple, android, embedded, authorize-ci]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Node for local provenance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: tools/native-attestation/package-lock.json
      - name: Install the hash-locked local provenance signer
        run: npm ci --ignore-scripts --omit=dev --prefix tools/native-attestation
      - name: Download latest producer-bound partials across run attempts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: >-
          python3 tools/native-artifacts.py download-partials
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/parts"
      - name: Create and sign the canonical manifest
        env:
          NATIVE_ARTIFACT_SIGNING_KEY: ${{ secrets.NATIVE_ARTIFACT_SIGNING_KEY }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          mkdir "$bundle"
          cp "$RUNNER_TEMP/parts"/* "$bundle/"
          version="$(python3 -c 'import re; print(re.search(r"version = \"([^\"]+)\"", open("Cargo.toml").read()).group(1))')"
          arguments=()
          for archive in "$bundle"/*.tar.gz "$bundle"/*.zip; do
            filename="$(basename "$archive")"
            if [[ "$filename" = "libhop.xcframework.zip" ]]; then
              target="apple-xcframework"
            else
              target="${filename#libhop-}"
              target="${target%.tar.gz}"
            fi
            arguments+=(--artifact "$target=$archive")
          done
          python3 tools/native-artifacts.py create \
            --output "$bundle/native-artifacts.json" \
            --version "$version" --tag "v$version" --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${arguments[@]}"
          test -n "$NATIVE_ARTIFACT_SIGNING_KEY"
          key="$RUNNER_TEMP/native-signing-key.pem"
          umask 077
          printf '%s\n' "$NATIVE_ARTIFACT_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/native-public.pem"
          cmp "$RUNNER_TEMP/native-public.pem" tools/native-artifacts-public.pem
          openssl dgst -sha256 -sign "$key" \
            -out "$bundle/native-artifacts.json.sig" "$bundle/native-artifacts.json"
          python3 tools/native-artifacts.py verify \
            --manifest "$bundle/native-artifacts.json" \
            --signature "$bundle/native-artifacts.json.sig" \
            --public-key tools/native-artifacts-public.pem \
            --directory "$bundle" --strict --source-sha "$SOURCE_SHA" \
            --tag "v$version" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          rm -f "$key"
      - name: Create local OIDC provenance bundle
        run: |
          node tools/native-attestation/create.mjs \
            --manifest "$RUNNER_TEMP/bundle/native-artifacts.json" \
            --signature "$RUNNER_TEMP/bundle/native-artifacts.json.sig" \
            --directory "$RUNNER_TEMP/bundle" \
            --output "$RUNNER_TEMP/bundle/native-artifacts.provenance.sigstore.json"
      - name: Verify local provenance and complete release inventory
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          version="$(python3 -c 'import re; print(re.search(r"version = \"([^\"]+)\"", open("Cargo.toml").read()).group(1))')"
          python3 tools/native-artifacts.py verify-provenance \
            --manifest "$RUNNER_TEMP/bundle/native-artifacts.json" \
            --signature "$RUNNER_TEMP/bundle/native-artifacts.json.sig" \
            --public-key tools/native-artifacts-public.pem \
            --directory "$RUNNER_TEMP/bundle" \
            --provenance-bundle "$RUNNER_TEMP/bundle/native-artifacts.provenance.sigstore.json" \
            --source-sha "$SOURCE_SHA" --tag "v$version" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Mirror provenance to GitHub attestation storage
        if: github.event.repository.visibility == 'public' || github.event.enterprise != null
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/bundle/native-artifacts.json
            ${{ runner.temp }}/bundle/native-artifacts.json.sig
            ${{ runner.temp }}/bundle/*.tar.gz
            ${{ runner.temp }}/bundle/*.zip
      - name: Upload immutable signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/*
          if-no-files-found: error
          retention-days: 90

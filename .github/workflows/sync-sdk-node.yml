# Mirror the sdk/node component to its own repo (hopmesh/hop-sdk-node) and import its PRs back, with
# Copybara (tools/copybara/copy.bara.sky). This is the Meta react-native/relay pattern, done with
# Copybara instead of fbshipit. See tools/copybara/README.md for the one-time bootstrap.
#
# NOT wired into the required-checks gate: this is a publish/mirror job, not a correctness gate. It runs
# AFTER a change lands on main.
name: Sync sdk/node

on:
  # Manual only until the one-time bootstrap is done (destination repo + COPYBARA_TOKEN secret exist),
  # so merging this workflow can't auto-run and fail on main. Use this to run the initial SQUASH seed
  # and to import PRs back from the mirror. AFTER bootstrap, uncomment the `push` block below so every
  # merge to main that touches sdk/node mirrors out automatically. See tools/copybara/README.md.
  workflow_dispatch:
    inputs:
      workflow:
        description: "Copybara workflow to run"
        type: choice
        options: [export, import]
        default: export
  # push:
  #   branches: [main]
  #   paths:
  #     - "sdk/node/**"
  #     - "tools/copybara/copy.bara.sky"
  #     - ".github/workflows/sync-sdk-node.yml"

# Never let two syncs of this component run at once (a race would fork the mirror history).
concurrency: sync-sdk-node

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Copybara replays history, so it needs the whole thing, not a shallow clone.
          fetch-depth: 0

      # olivr/copybara-action runs Copybara in a container and wires up the git credentials for BOTH
      # repos from access_token, so the raw `docker run` + credential-helper dance stays out of here.
      - name: Copybara ${{ github.event.inputs.workflow || 'export' }}
        uses: olivr/copybara-action@v1.2.4
        with:
          # A PAT (or GitHub App token) with `repo` scope on BOTH hopmesh/hop and hopmesh/hop-sdk-node.
          # The default GITHUB_TOKEN is scoped to this repo only and cannot push to the mirror.
          access_token: ${{ secrets.COPYBARA_TOKEN }}
          sot_repo: hopmesh/hop
          destination_repo: hopmesh/hop-sdk-node
          custom_config: tools/copybara/copy.bara.sky
          workflow: ${{ github.event.inputs.workflow || 'export' }}
          # --ignore-noop: a push that changed nothing under sdk/node is a clean no-op, not a failure.
          copybara_options: "--ignore-noop"

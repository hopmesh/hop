# Auto-merge Dependabot PRs. Each incoming Dependabot bump gets squash auto-merge enabled, so it
# merges itself ONCE the required CI checks pass. Branch protection still gates it: a bump that reddens
# CI (a major that needs a real migration) never merges and stays open for a human. Nothing here runs
# untrusted PR code, it only calls the GitHub API, so `pull_request_target` (which grants the write
# token Dependabot's own read-only token lacks) is safe.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

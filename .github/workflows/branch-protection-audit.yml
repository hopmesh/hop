name: Branch protection audit

# quality-net-r2-03: the deploy gate's INTENT half - that `main` actually requires the CI checks so a
# red commit can't land - lives in GitHub repo settings (branch protection), which no repo file can
# set. That single external config, if missing or drifted (a renamed job), silently turns the whole
# pre-merge gate into advisory. This job re-derives the required check set from ci.yml and asserts the
# live branch-protection rule on `main` requires EXACTLY that set, so drift is caught IN-REPO (a failing
# scheduled run) instead of being trusted forever.
#
# Needs a token that can READ branch protection, which requires repo-administration access. The default
# GITHUB_TOKEN CANNOT be granted this: `administration` is not a valid `permissions:` scope (GitHub
# rejects the whole workflow file if you try, which is exactly what broke this audit, it ran 0 jobs), and
# the token has no admin access by default regardless. So the live assertion runs ONLY when a
# BRANCH_PROTECTION_TOKEN secret (a fine-grained PAT / app token with `administration: read` on this repo)
# is set; without it the audit skips with an actionable notice rather than a misleading permanent red.
# To arm the drift-detector: create that PAT and add it as the BRANCH_PROTECTION_TOKEN repo secret.

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, 13:17 UTC
  workflow_dispatch:
  # Also run when the gate's inputs change, so a job rename is caught immediately (not just weekly).
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/branch-protection-audit.yml"
      - "infra/cloudbuild.trigger.yaml"
      - "tools/check-required-checks.sh"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First: the in-repo pair (ci.yml <-> _REQUIRED_CHECKS) must already agree. If this fails, the
      # audit below would compare against a self-inconsistent expectation.
      - name: Required-check allowlist is in sync (in-repo)
        run: bash tools/check-required-checks.sh

      # Then: assert the LIVE branch protection on main requires exactly the ci.yml job names. This runs
      # ONLY with a real admin-read PAT (BRANCH_PROTECTION_TOKEN); the default GITHUB_TOKEN 403s on the
      # protection API, so without the secret we skip with an actionable notice instead of a false red.
      - name: Assert main branch protection requires the CI checks
        env:
          BP_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "${BP_TOKEN:-}" ]; then
            echo "::notice title=branch-protection audit skipped::BRANCH_PROTECTION_TOKEN is not set, so the live protection rule could not be read (the default GITHUB_TOKEN lacks administration:read). To arm this drift-detector, add a fine-grained PAT with 'administration: read' on this repo as the BRANCH_PROTECTION_TOKEN secret."
            exit 0
          fi
          GH_TOKEN="$BP_TOKEN" bash tools/check-branch-protection.sh

      # Same shape, for the OTHER live-config drift that went unnoticed far longer: every mirror's
      # release.yml references HOP_SOURCE_APP_ID / HOP_SOURCE_APP_PRIVATE_KEY, none of them were ever
      # seeded, and because GitHub resolves an unset secret to the empty string the only symptom was a
      # third-party action erroring on an empty input. Nothing published for as long as the mirrors
      # existed. Reading secret METADATA (names only, never values) needs a token with secrets/admin
      # read on the mirrors plus admin:org for org-scoped secrets, so this skips loudly without one
      # rather than going red for a missing credential it cannot see.
      - name: Assert every publishing mirror has the secrets its release workflow references
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_SECRET_AUDIT_TOKEN }}
        run: |
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::notice title=mirror-secret audit skipped::MIRROR_SECRET_AUDIT_TOKEN is not set, so mirror secret metadata could not be read. To arm this, add a PAT with 'secrets: read' on the hopmesh mirrors (plus admin:org for organization-scoped secrets) as MIRROR_SECRET_AUDIT_TOKEN. Meanwhile run tools/release/check-mirror-secrets.py locally; see docs/release-engineering.md."
            exit 0
          fi
          GH_TOKEN="$MIRROR_TOKEN" python3 tools/release/check-mirror-secrets.py

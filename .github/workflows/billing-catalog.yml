# Apply the keyed-SaaS root (infra/billing) via CI/CD, never a local tofu run. This root holds the
# Stripe billing catalog AND the Resend sending domain (resend.tf); both register a resource on a SaaS
# via an API key, so they share this workflow and identity.
#
# - On a PR that touches infra/billing/**: `tofu plan` so the diff is reviewable.
# - On manual dispatch with confirm=apply: `tofu apply` (creating live Stripe resources is
#   consequential and meters are append-only; registering the Resend domain is likewise a deliberate
#   step, so both are gated behind a click, not a push).
#
# Auth is keyless: GitHub OIDC -> Workload Identity Federation -> the billing-catalog-apply service
# account (infra/bootstrap/billing.tf), which can reach ONLY the billing/ Terraform state prefix. The
# Stripe key is the STRIPE_API_KEY repo secret; the Resend key is RESEND_API_KEY (domain scope). The
# job stays neutral until its two repository variables have been populated from the reviewed bootstrap
# outputs. Neither API key ever enters state.
name: Billing catalog (Stripe + Resend)

on:
  pull_request:
    paths: ["infra/billing/**"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to create/update the LIVE Stripe catalog (else plan only)'
        required: true
        default: "plan"

permissions:
  contents: read
  id-token: write # required for the WIF OIDC token exchange

concurrency: billing-catalog # never two catalog applies at once

jobs:
  catalog:
    # Neutral until bootstrap is applied and both exact output values are wired as repo variables.
    if: vars.GCP_BILLING_WIF_PROVIDER != '' && vars.GCP_BILLING_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/billing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: hop-mesh
          workload_identity_provider: ${{ vars.GCP_BILLING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BILLING_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        env:
          TF_VAR_stripe_api_key: ${{ secrets.STRIPE_API_KEY }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
        run: tofu plan -input=false -no-color

      - name: tofu apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'apply'
        env:
          TF_VAR_stripe_api_key: ${{ secrets.STRIPE_API_KEY }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
        run: tofu apply -input=false -auto-approve -no-color

      - name: catalog outputs (ids the metering system needs + Resend domain status)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'apply'
        run: |
          echo "meter event_names:"; tofu output -json meter_event_names
          echo "price ids:";         tofu output -json price_ids
          echo "resend status:";     tofu output -raw resend_domain_status

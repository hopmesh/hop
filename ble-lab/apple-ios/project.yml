name: HopBleLab
options:
  bundleIdPrefix: sh.hopme
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  HopBearers:
    # The shared transport package. The iOS clean-room app now runs the SAME BleBearer the macOS CLI
    # (blepeer) runs — a fix proven in the package is this app's fix with no copy. Was: ../apple/HopBleLab.swift.
    path: ../../apple/HopBearers
targets:
  HopBleLab:
    type: application
    platform: iOS
    sources:
      - BleLabApp.swift
      - BeaconWake.swift
      - ContentView.swift
    dependencies:
      - package: HopBearers
        product: HopBearerCore
      - package: HopBearers
        product: HopBearerBle
      - package: HopBearers
        product: HopBearerProof
    info:
      path: HopBleLab-Info.plist
      properties:
        CFBundleDisplayName: BLE Lab
        NSBluetoothAlwaysUsageDescription: "BLE Lab tests Bluetooth LE connectivity between devices over L2CAP."
        NSBluetoothPeripheralUsageDescription: "BLE Lab advertises a BLE service and hosts an L2CAP channel for the proof-of-pipe test."
        NSLocationWhenInUseUsageDescription: "BLE Lab detects a nearby Hop device beacon to reconnect."
        NSLocationAlwaysAndWhenInUseUsageDescription: "BLE Lab monitors a Hop iBeacon region so it can relaunch in the background and reconnect to nearby devices even when the app is closed."
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - location
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.hopme.blelab
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 8H7HVPHS87
        CODE_SIGN_STYLE: Automatic

  HopBleLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/GrantBTPermission.swift
    dependencies:
      - target: HopBleLab
    settings:
      base:
        DEVELOPMENT_TEAM: 8H7HVPHS87
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HopBleLab

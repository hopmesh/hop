[workspace]
resolver = "2"
members = [
    "core/hop-core",
    "core/hop",
    "core/hop-endpoint",
    "core/hop-sim",
    "core/hop-wasm",
    "core/stores/hop-store-sqlite",
    "core/stores/hop-store-firestore",
    "services/hop-relayd",
    "services/hop-gateway",
    "services/hop-endpoint",
    "services/hop-billingd",
    "services/hop-telemetryd",
    "services/hop-accountd",
    "examples/hop-example-origin",
]
exclude = ["site", "sdk/elixir/native/hop_endpoint", "fuzz"]

[workspace.package]
version = "0.0.2"
edition = "2021"
# No repo-wide license: this is a monorepo; components carry their own license as they split out.
repository = "https://github.com/hopmesh/monorepo"

# CI-DISK: test/dev binaries carry full debug info by default, which is the single largest consumer
# of target/ space. This job builds the workspace plus SIX additional feature-set permutations, so
# the debug info is paid for repeatedly and it exhausted the runner's disk on 2026-07-25. Line tables
# keep panics and backtraces useful (file + line) at a fraction of the size; nobody is running a
# debugger against CI artifacts. Local `cargo test` gets the same benefit.
[profile.test]
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
hop-core = { path = "core/hop-core", version = "0.0.2" }
hop-endpoint-core = { path = "core/hop-endpoint", version = "0.0.2" }
# default-features off so each consumer picks plain `bundled` (default) OR encrypted `sqlcipher`
# explicitly (F-25). The two SQLite bundling backends can't both be active in one build.
hop-store-sqlite = { path = "core/stores/hop-store-sqlite", version = "0.0.2", default-features = false }
hop-store-firestore = { path = "core/stores/hop-store-firestore", version = "0.0.2" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
blake3 = "1"
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
miniz_oxide = "0.9"
# snow 0.10.0's `std` feature erroneously lists `ring/std` (no `?`), which force-pulls the unused C
# `ring` even though we only use the pure-Rust default-resolver. That dead dep breaks the ESP32
# cross-compile (ring needs the ESP GCC). Drop snow's default features and enable only the pure-Rust
# resolver: same active crypto (ChaCha20-Poly1305/AES-GCM/X25519/BLAKE2), no ring, portable everywhere.
snow = { version = "0.10", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
rusqlite = { version = "0.40", features = ["bundled"] }

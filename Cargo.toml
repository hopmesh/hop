[workspace]
resolver = "2"
members = [
    "core/hop-core",
    "core/hop",
    "core/hop-endpoint",
    "core/hop-sim",
    "core/hop-wasm",
    "core/stores/hop-store-sqlite",
    "core/stores/hop-store-firestore",
    "services/hop-relayd",
    "services/hop-gateway",
    "services/hop-endpoint",
    "services/hop-billingd",
    "examples/hop-example-origin",
]
exclude = ["site", "sdk/elixir/native/hop_endpoint"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# No repo-wide license: this is a monorepo; components carry their own license as they split out.
repository = "https://github.com/jwaldrip/hop"

[workspace.dependencies]
hop-core = { path = "core/hop-core" }
hop-endpoint-core = { path = "core/hop-endpoint" }
# default-features off so each consumer picks plain `bundled` (default) OR encrypted `sqlcipher`
# explicitly (F-25). The two SQLite bundling backends can't both be active in one build.
hop-store-sqlite = { path = "core/stores/hop-store-sqlite", default-features = false }
hop-store-firestore = { path = "core/stores/hop-store-firestore" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
miniz_oxide = "0.9"
# snow 0.10.0's `std` feature erroneously lists `ring/std` (no `?`), which force-pulls the unused C
# `ring` even though we only use the pure-Rust default-resolver. That dead dep breaks the ESP32
# cross-compile (ring needs the ESP GCC). Drop snow's default features and enable only the pure-Rust
# resolver: same active crypto (ChaCha20-Poly1305/AES-GCM/X25519/BLAKE2), no ring, portable everywhere.
snow = { version = "0.10", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
rusqlite = { version = "0.40", features = ["bundled"] }

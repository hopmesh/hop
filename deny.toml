# cargo-deny configuration for the Hop workspace supply-chain gate.
#
# Run locally with:
#   cargo install cargo-deny
#   cargo deny check
#
# In CI this runs as the `deny` job (.github/workflows/ci.yml) so an
# advisory, a banned/duplicate dependency, or a disallowed source can block a merge
# before it reaches the Cloud Build deploy trigger. Uses the current cargo-deny
# schema (advisories/licenses without the removed *-severity fields).

[graph]
# Check the full dependency graph regardless of target so the wasm, host, and
# service builds are all covered by one pass.
all-features = false

[advisories]
# RustSec advisory DB. `deny` unmaintained/yanked so supply-chain rot is visible.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"
# No blanket ignores. Add a specific "RUSTSEC-YYYY-NNNN" here ONLY with a comment
# explaining why the advisory does not apply to Hop and who signed off.
ignore = []

[licenses]
private = { ignore = true }
# No repo-wide root license: every first-party crate carries its OWN FSL-1.1-ALv2 via a crate-local
# `license-file = "LICENSE.md"` (FSL is not an SPDX id, hence license-file not a `license` field).
# In CI this is gated via the `deny` job. First-party crates are clarified via
# `[[licenses.clarify]]` mapping their license-file to `LicenseRef-FSL-1.1-ALv2`
# (or exempted via `[licenses] private = { ignore = true }`).
# This list governs THIRD-PARTY dependency licenses, which must be permissive so they can travel inside
# the shipped binaries and the per-bearer packages.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "LicenseRef-FSL-1.1-ALv2",
]
# A crate missing usable license metadata falls below this and fails the check, which is what we want
# for THIRD-PARTY crates (unknown terms should not ship). First-party crates carry FSL via license-file.
confidence-threshold = 0.9

# FSL is not an SPDX-listed license. Bind the custom identifier to the byte-identical license file
# carried by every core crate; repo-integrity-guard.sh separately enforces that these copies stay in
# lockstep. Any text change invalidates the hash and forces a deliberate clarification update.
[[licenses.clarify]]
crate = "hop"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-endpoint-core"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-sim"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-store-firestore"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-store-sqlite"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-wasm"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[bans]
# Warn on duplicate versions of the same crate so tree bloat and skew stay visible;
# deny wildcard version requirements in first-party crates.
multiple-versions = "warn"
wildcards = "deny"
# Local workspace crates are intentionally path-only and never resolved from a registry. Keep the
# wildcard ban for external dependencies without misclassifying these first-party paths.
allow-wildcard-paths = true
# Keep the crypto and store backends single-sourced. Add a specific ban here (with a
# comment) if a dependency reintroduces something we removed on purpose.
deny = []
# The two SQLite bundling backends (bundled vs sqlcipher) cannot both be active in one
# build; that is enforced by feature wiring in Cargo.toml, not here.
skip = []

[sources]
# Only crates.io and the first-party git repo are allowed sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[[licenses.clarify]]
crate = "hop-endpoint"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-gateway"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-relayd"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-telemetryd"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

[[licenses.clarify]]
crate = "hop-example-origin"
expression = "LicenseRef-FSL-1.1-ALv2"
license-files = [{ path = "LICENSE.md", hash = 0xf0da4c46 }]

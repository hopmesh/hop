# Validate the tagged bearer package before creating its GitHub release.
#
# This package is PURE SWIFT: every bearer target depends only on the HopContract product of the
# PUBLISHED hop-sdk-apple package, so there is no binary target, no xcframework, no checksum pin, and
# no payload to attach. For SwiftPM the repository IS the package and the git tag is the version a
# consumer resolves, so the release itself is the tag plus generated notes.
#
# That does NOT make this a bare tag push. The chain of custody every publishing workflow in the fleet
# uses is the release VALIDATION MANIFEST, not the payload: the build job records what it validated and
# uploads that manifest as an immutable artifact, and the publish job re-verifies it against the
# canonical source SHA that provenance resolved before it creates anything. The crystal shard mirror
# ships nothing binary either and follows exactly this shape; tools/executable-reference-guard.py
# enforces it, which is how an earlier draft of this file that skipped straight to the release got
# caught. Two authority rules matter and are enforced there: the build job holds no secrets and no
# environment, and the publish job neither builds nor tests.
#
# WHICH MANIFEST THE BUILD EXERCISES, and why only that one. The per-bearer Package.swift files under
# HopBearer*/ depend on the in-tree sdk/apple BY PATH, so they resolve only inside the monorepo, where
# each bearer package is built and coverage-gated independently (tools/apple-cov-gate.sh). The
# aggregate ROOT manifest at this repository's root is what the mirror publishes and what a consumer
# resolves, and it deliberately names the PUBLISHED hop-sdk-apple by URL: `sdk/apple` and
# `bearers/apple` share the final path component "apple", which is a path dependency's identity, so a
# path dependency made SwiftPM read the package as depending on itself (cyclic dependency,
# HopBearersApple -> HopBearersApple) and raising swift-tools-version to 6.0 to appease it would push a
# Swift 6 toolchain requirement onto every consumer. Building the root manifest here proves the exact
# consumer path. The per-bearer manifests ride along in the export, but SwiftPM ignores a manifest in a
# subdirectory that nothing references, so their path dependencies never enter this build.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    # macOS because the bearers compile against CoreBluetooth, MultipeerConnectivity and Network, and
    # the manifest declares macOS 13 / iOS 16.
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # One `swift build` at the root builds every bearer target: each of the five products maps to
      # exactly one target, so this compiles HopBearerBle, HopBearerLan, HopBearerMultipeer,
      # HopBearerRelay and HopBearerMeshtastic. Resolving hop-sdk-apple from its published URL is part
      # of the proof, not incidental to it.
      - name: Build the aggregate root package
        run: swift build
      # The stronger half: a throwaway package OUTSIDE the repository resolves this checkout and links
      # all five products, which is the resolution shape a consumer app uses against the tag. A tag on
      # a manifest that does not resolve strands every consumer pinned to it until the next tag.
      #
      # The product reference names "hop-bearers-apple" because a path dependency's identity is the
      # final component of its path, here the checkout directory, which is the mirror's repository
      # name. This clean-consumer compile is also why there is no `swift test`: the root manifest
      # declares no test targets, since the suites live in the per-bearer packages, which are
      # monorepo-only.
      - name: Resolve and build a clean consumer of all five bearer products
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/bearers-consumer"
          mkdir -p "$consumer/Sources/CleanConsumer"
          cat > "$consumer/Package.swift" <<EOF
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
            name: "CleanConsumer",
            platforms: [.macOS(.v13)],
            dependencies: [.package(path: "$GITHUB_WORKSPACE")],
            targets: [.executableTarget(name: "CleanConsumer", dependencies: [
              .product(name: "HopBearerBle", package: "hop-bearers-apple"),
              .product(name: "HopBearerLan", package: "hop-bearers-apple"),
              .product(name: "HopBearerMultipeer", package: "hop-bearers-apple"),
              .product(name: "HopBearerRelay", package: "hop-bearers-apple"),
              .product(name: "HopBearerMeshtastic", package: "hop-bearers-apple"),
            ])]
          )
          EOF
          printf 'import HopBearerBle\nimport HopBearerLan\nimport HopBearerMultipeer\nimport HopBearerRelay\nimport HopBearerMeshtastic\nprint("Hop bearers consumer compiled")\n' > "$consumer/Sources/CleanConsumer/main.swift"
          swift package --package-path "$consumer" resolve
          swift build --package-path "$consumer"
      # Record what was validated. This manifest is the immutable thing the publish job verifies, and
      # it is what makes a payload-free release auditable at all.
      - name: Record the release validation manifest
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release"
          python3 .github/release-artifact.py create --directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Read-only token scoped to the canonical monorepo: the provenance verifier reads the source
      # SHA, its CI runs and the export tree from hopmesh/hop, and needs nothing wider.
      - name: Mint canonical-source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOP_SOURCE_APP_ID }}
          private-key: ${{ secrets.HOP_SOURCE_APP_PRIVATE_KEY }}
          owner: hopmesh
          repositories: hop
          permission-actions: read
          permission-checks: read
          permission-contents: read
      # Prove the tagged commit is a faithful export of a green canonical main commit before anything
      # is published against the tag. Run WITHOUT the native-artifacts requirement: this component
      # ships no native bundle, so there is no native build to bind, while everything else the
      # verifier checks (tag shape, GitOrigin-RevId lineage, export-tree equality, required CI checks)
      # applies unchanged.
      - name: Verify canonical source provenance
        id: provenance
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: python3 .github/release-provenance.py --component hop-bearers-apple --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify release validation artifact
        run: >-
          python3 .github/release-artifact.py verify --directory "$RUNNER_TEMP/release"
          --canonical-source-sha '${{ steps.provenance.outputs.source_sha }}'
      - name: Create GitHub release for verified tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true

# git-cliff config for Hop. Generates the monorepo CHANGELOG.md and a per-library CHANGELOG.md for
# each mirrored component, from conventional-commit messages. The merge-commit workflow (we never
# squash) keeps every real feat/fix commit intact in history, so git-cliff sees them all; merge
# commits are unconventional and dropped. Regenerated by .github/workflows/changelog.yml, never edited
# by hand.

[changelog]
header = """
# Changelog

Notable changes, generated from [conventional commits](https://www.conventionalcommits.org) by
git-cliff. Do not edit by hand.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
# Drop anything that is not a conventional commit (merge commits, WIP, reverts we do not want listed).
filter_unconventional = true
split_commits = false
# Strip the scope in parentheses off the type prefix when grouping (e.g. deps(android): -> Dependencies).
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^deps", group = "Dependencies" },
  { message = "^build", group = "Build" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Chore" },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

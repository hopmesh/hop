name: HopBleLab
options:
  bundleIdPrefix: sh.hopme
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  # Repointed after 2ae1d753 deleted apps/apple/HopBearers as "orphaned". It was not orphaned: this
  # app depended on it, and no CI job builds ble-lab, so the breakage went unnoticed and HopBleLab
  # became unbuildable from source. The app still runs the SAME BleBearer the product runs, which is
  # the entire point of the clean room; it now takes it from the real package.
  HopBearerBle:
    path: ../../../bearers/apple/HopBearerBle
  apple:
    path: ../../../sdk/apple
targets:
  HopBleLab:
    type: application
    platform: iOS
    sources:
      - BleLabApp.swift
      - BeaconWake.swift
      - ContentView.swift
      - LabRadio.swift
      - ProofSink.swift
    dependencies:
      # HopBearerCore became HopContract and moved into sdk/apple; HopBearerProof is gone and its
      # ProofSink is restored as an app source (ProofSink.swift).
      - package: HopBearerBle
        product: HopBearerBle
      - package: apple
        product: HopContract
    info:
      path: HopBleLab-Info.plist
      properties:
        CFBundleDisplayName: BLE Lab
        NSBluetoothAlwaysUsageDescription: "BLE Lab tests Bluetooth LE connectivity between devices over L2CAP."
        NSBluetoothPeripheralUsageDescription: "BLE Lab advertises a BLE service and hosts an L2CAP channel for the proof-of-pipe test."
        NSLocationWhenInUseUsageDescription: "BLE Lab detects a nearby Hop device beacon to reconnect."
        NSLocationAlwaysAndWhenInUseUsageDescription: "BLE Lab monitors a Hop iBeacon region so it can relaunch in the background and reconnect to nearby devices even when the app is closed."
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - location
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.hopme.blelab
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 8H7HVPHS87
        CODE_SIGN_STYLE: Automatic

  HopBleLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LabRadioTests.swift
    dependencies:
      - target: HopBleLab
    settings:
      base:
        DEVELOPMENT_TEAM: 8H7HVPHS87
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HopBleLab.app/HopBleLab"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HopBleLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/GrantBTPermission.swift
    dependencies:
      - target: HopBleLab
    settings:
      base:
        DEVELOPMENT_TEAM: 8H7HVPHS87
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HopBleLab

org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 defaults to two new behaviors this migration deliberately opts OUT of, to land the AGP/Kotlin/
# Compose version bumps as a pure toolchain change with no app-architecture migration:
#   - android.builtInKotlin: AGP 9 now compiles Kotlin itself by default, and that built-in support
#     conflicts with the separate org.jetbrains.kotlin.android plugin this build still applies (both
#     register a `kotlin` extension). false keeps the classic Kotlin Gradle Plugin path.
#   - android.newDsl: AGP 9 defaults the `android {}` extension to a new, BaseExtension-free API surface.
#     Every build.gradle.kts here uses the classic DSL (composeOptions-era buildTypes.getByName, etc.),
#     and the classic org.jetbrains.kotlin.android plugin isn't compatible with the new DSL either.
# Both are documented, supported opt-outs (removed in AGP 10, which is a future migration, not this one).
android.builtInKotlin=false
android.newDsl=false

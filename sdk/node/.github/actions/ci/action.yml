# Canonical CI for the @hop-mesh/endpoint SDK, referenced from the monorepo root workflow as
#   uses: ./sdk/node/.github/actions/ci
# It stays a COMPOSITE ACTION so the package's verification lives next to the package. There is no
# reusable-workflow equivalent, GitHub requires those to live in root .github/workflows/, so a
# composite action is the only unit that can live in a subfolder and still be referenced from the root.
name: "Hop Node SDK CI"
description: "Test @hop-mesh/endpoint against a libhop built from the in-tree Rust core."

inputs:
  pkg-dir:
    description: "Directory of the SDK package, relative to the repository root."
    default: "sdk/node"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20.20.2

    # Cache the cargo build of the in-tree Rust core.
    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-hopsdk-node-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-hopsdk-node-${{ runner.os }}-

    # The crux: get a libhop for THIS runner. The Rust core (core/hop) is a sibling in this repo, so we
    # build it here. HOP_LIBDIR is the escape hatch: point it at a prebuilt libhop and the build is skipped.
    - name: Resolve libhop
      id: libhop
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${HOP_LIBDIR:-}" ]; then
          echo "using caller-provided HOP_LIBDIR=$HOP_LIBDIR"
          echo "dir=$HOP_LIBDIR" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f core/hop/Cargo.toml ]; then
          echo "core/hop/Cargo.toml not found; set HOP_LIBDIR to a prebuilt libhop" >&2
          exit 1
        fi
        rustup toolchain install 1.97.0 --profile minimal
        cargo build -p hop --locked
        echo "dir=$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_OUTPUT"

    - name: Test
      shell: bash
      working-directory: ${{ inputs.pkg-dir }}
      env:
        HOP_LIBDIR: ${{ steps.libhop.outputs.dir }}
      run: |
        npm ci
        npm test

// Gradle build for the @hop-mesh/react-native Android module. It depends on the published Hop Android
// client SDK (sh.hop:hop, from sdk/android in the Hop monorepo), which bundles libhop's native
// ABI slices, and on the host app's React Native. Versions are read from the app's root project where
// possible so this module tracks the app's toolchain.

buildscript {
  ext.getExtOr = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.5.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOr('kotlinVersion', '1.9.24')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "sh.hop.reactnative"
  compileSdkVersion getExtOr("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion getExtOr("minSdkVersion", 24)
    targetSdkVersion getExtOr("targetSdkVersion", 34)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

// The Hop Android SDK and Android bearer versions. `sdk/android/build-aar-dev.sh` is the source of
// the local Maven layout. The React Native bridge intentionally consumes BLE and LAN only; relay has
// a separate native probe, so do not add a relay AAR here as an unused transitive dependency.
def hopSdkVersion = getExtOr("hopSdkVersion", "0.0.5")
def hopBearerVersion = getExtOr("hopBearerVersion", "0.0.2")

// Where sh.hop:hop and the native bearer AARs are resolved from. They are not on Maven Central, so
// a host must build the canonical local repository before Gradle evaluates this package.
//
// Order: an explicit rootProject ext wins, then HOP_MAVEN_REPOSITORY, then the package-local default.
def hopMavenRepository = rootProject.ext.has("hopMavenRepository")
  ? rootProject.ext.get("hopMavenRepository").toString()
  : (System.getenv("HOP_MAVEN_REPOSITORY") ?: new File(projectDir, ".hop-maven").absolutePath)

def requiredHopAars = [
  new File(hopMavenRepository, "sh/hop/hop/${hopSdkVersion}/hop-${hopSdkVersion}.aar"),
  new File(hopMavenRepository, "sh/hop/bearers/bearer-ble/${hopBearerVersion}/bearer-ble-${hopBearerVersion}.aar"),
  new File(hopMavenRepository, "sh/hop/bearers/bearer-lan/${hopBearerVersion}/bearer-lan-${hopBearerVersion}.aar"),
]
def missingHopAars = requiredHopAars.findAll { !it.isFile() }
if (!missingHopAars.isEmpty()) {
  throw new GradleException("""
@hop-mesh/react-native: the Hop Android SDK and native BLE/LAN bearers are not available.

  missing:
${missingHopAars.collect { "  ${it}" }.join("\n")}

Build the canonical local Maven repository from the Hop monorepo:

  ./sdk/android/build-aar-dev.sh --repository ${hopMavenRepository}

Then either leave it there, or point this module elsewhere with
HOP_MAVEN_REPOSITORY=<repo-path>. This bridge deliberately does not source-link bearer code:
every bearer must resolve the one sh.hop:hop AAR through its POM.
""")
}

repositories {
  google()
  mavenCentral()
  // Consumed as a REPOSITORY, deliberately, not as files("...hop.aar") or a flatDir. The generated
  // POM declares net.java.dev.jna:jna:5.19.1 as a runtime dependency. A file or flatDir dependency
  // carries no POM, so that transitive would be dropped silently: the module compiles, the APK
  // builds, and JNA is missing at runtime, surfacing as a ClassNotFoundError the first time JS calls
  // into the bridge. A green build that proves nothing is worse than a red one.
  maven {
    url = uri(hopMavenRepository)
    content {
      includeGroup "sh.hop"
      includeGroup "sh.hop.bearers"
    }
  }
}

dependencies {
  // com.facebook.react:react-native tops out at 0.71.0-rc.0 on Maven Central; the coordinate for
  // modern React Native is com.facebook.react:react-android, which carries 0.77.3 through 0.87.0.
  // The old `react-native:+` therefore resolved to a years-old artifact on any current app. This is a
  // FLOOR, not a pin: a host app on a newer React Native wins by normal version conflict resolution.
  implementation "com.facebook.react:react-android:${getExtOr('reactNativeVersion', '0.77.3')}"
  implementation "sh.hop:hop:${hopSdkVersion}"
  implementation "sh.hop.bearers:bearer-ble:${hopBearerVersion}"
  implementation "sh.hop.bearers:bearer-lan:${hopBearerVersion}"
}

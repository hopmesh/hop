// Gradle build for the @hop-mesh/react-native Android module. It depends on the Hop platform DRIVER
// (:hop-driver, drivers/android/hop-driver), which is what owns the radios, the peer table and the
// message store, and on the Kotlin SDK the driver is built over (:hop-sdk, the shared sh.hop source
// under sdk/android). Versions are read from the app's root project where possible so this module
// tracks the app's toolchain.

buildscript {
  ext.getExtOr = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.5.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOr('kotlinVersion', '1.9.24')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "sh.hop.reactnative"
  // 37 is a FLOOR, not a preference: :hop-driver pulls androidx.core:core-ktx 1.19.0, whose AAR
  // metadata hard-requires compileSdk >= 37 from every consumer. A host app above it still wins.
  compileSdkVersion Math.max(getExtOr("compileSdkVersion", 37), 37)

  defaultConfig {
    // 29 is likewise a floor: :hop-driver's minSdk is 29 because BLE L2CAP CoC
    // (createInsecureL2capChannel) requires API 29+, and a library may not declare a lower minSdk than
    // a library it depends on. An app on a lower floor cannot host the driver at all, so this fails at
    // its own manifest merge rather than at the app's, where the cause is harder to read.
    minSdkVersion Math.max(getExtOr("minSdkVersion", 29), 29)
    targetSdkVersion getExtOr("targetSdkVersion", 34)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // com.facebook.react:react-native tops out at 0.71.0-rc.0 on Maven Central; the coordinate for
  // modern React Native is com.facebook.react:react-android, which carries 0.77.3 through 0.87.0.
  // The old `react-native:+` therefore resolved to a years-old artifact on any current app. This is a
  // FLOOR, not a pin: a host app on a newer React Native wins by normal version conflict resolution.
  implementation "com.facebook.react:react-android:${getExtOr('reactNativeVersion', '0.77.3')}"

  // The Hop runtime: the driver (sh.hopme.driver), the shared bearers it multiplexes, the generated
  // UniFFI bindings (uniffi.hop) and the libhop.so slices all arrive through this one dependency, the
  // same way apps/android/HopDemo consumes it. HopDriverModule bridges it to JavaScript.
  //
  // A PROJECT dependency, because sh.hopme:hop-driver is published to no Maven repository: both Gradle
  // builds in this monorepo that compile the driver (apps/android/HopDemo and bearers/android) include
  // it by path, so a consuming app has to as well. See docs/react-native-quickstart.md for the six
  // settings.gradle lines an app needs.
  implementation project(':hop-driver')

  // The Kotlin SDK (sh.hop), which HopMeshModule is written against. The driver depends on it as
  // `implementation`, so it is on the driver's runtime classpath but not on this module's compile
  // classpath, and HopMeshModule would not compile without it here.
  //
  // NOT the published sh.hop:hop AAR. That AAR's classes.jar carries the same 26 sh.hop.* classes this
  // project compiles from the same sources under sdk/android, and two copies of a class on one app's
  // runtime classpath is a dex duplicate-class failure. The AAR's other payload, the libhop.so slices,
  // now reaches the app through :hop-driver's jniLibs, so nothing is lost by dropping it.
  implementation project(':hop-sdk')
}

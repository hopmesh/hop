# DORMANT in the monorepo: GitHub only runs workflows in the ROOT .github/workflows/, so this file does
# nothing here. It ACTIVATES in the standalone hop-sdk-react-native repo, where Copybara strips the
# sdk/react-native/ prefix and this lands at .github/workflows/ci.yml (the root). There it runs the same
# checks the monorepo runs, via the SAME canonical composite action (./.github/actions/ci).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/ci
        with:
          pkg-dir: "."

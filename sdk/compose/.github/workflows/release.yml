# Build and publish the Compose Multiplatform Maven publication (sh.hop:hop-compose) from one verified
# source tree. Non-native: the library carries no libhop slices of its own (the engine is app-supplied
# behind the HopEngine seam), so this mirrors the source-provenance-gated publish path of the other
# non-native SDKs rather than the native-artifact path. This file is carried in from the Hop monorepo
# subtree by Copybara; edit it there, never in a mirror.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17.0.19+10
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Verify version and build the Maven publication
        run: |
          set -euo pipefail
          declared="$(python3 -c 'import re; print(re.search(r"^version = \"([^\"]+)\"$", open("build.gradle.kts").read(), re.M).group(1))')"
          test "v$declared" = "$GITHUB_REF_NAME"
          repository="$RUNNER_TEMP/release/maven"
          mkdir -p "$repository"
          gradle publishAllPublicationsToHopRepository -PhopMavenRepository="$repository" --no-daemon
          python3 .github/release-artifact.py create --directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Mint canonical-source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOP_SOURCE_APP_ID }}
          private-key: ${{ secrets.HOP_SOURCE_APP_PRIVATE_KEY }}
          owner: hopmesh
          repositories: monorepo
          permission-actions: read
          permission-checks: read
          permission-contents: read
      - name: Verify canonical source provenance
        id: provenance
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: python3 .github/release-provenance.py --component hop-sdk-compose --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify immutable Maven repository
        run: >-
          python3 .github/release-artifact.py verify --directory "$RUNNER_TEMP/release"
          --canonical-source-sha '${{ steps.provenance.outputs.source_sha }}'
      - name: Sign and publish copies of verified Maven files
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_PASSWORD"
          test -n "$MAVEN_SIGNING_KEY"
          test -n "$MAVEN_SIGNING_PASSWORD"
          cp -R "$RUNNER_TEMP/release/maven" "$RUNNER_TEMP/publish-maven"
          printf '%s\n' "$MAVEN_SIGNING_KEY" | gpg --batch --import
          python3 - "$RUNNER_TEMP/publish-maven" <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.parse
          import urllib.request

          root = Path(sys.argv[1])
          primary = [
              path for path in sorted(root.rglob("*"))
              if path.is_file() and not path.name.endswith((".sha256", ".sha512", ".asc"))
          ]
          for path in primary:
              subprocess.run(
                  ["gpg", "--batch", "--yes", "--pinentry-mode", "loopback",
                   "--passphrase", os.environ["MAVEN_SIGNING_PASSWORD"],
                   "--armor", "--detach-sign", str(path)],
                  check=True,
              )
          for path in [item for item in sorted(root.rglob("*")) if item.is_file() and not item.name.endswith((".sha256", ".sha512"))]:
              payload = path.read_bytes()
              path.with_name(path.name + ".sha256").write_text(hashlib.sha256(payload).hexdigest() + "\n")
              path.with_name(path.name + ".sha512").write_text(hashlib.sha512(payload).hexdigest() + "\n")

          endpoint = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
          credential = base64.b64encode(
              f"{os.environ['MAVEN_USERNAME']}:{os.environ['MAVEN_PASSWORD']}".encode()
          ).decode()
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              relative = path.relative_to(root).as_posix()
              url = endpoint + "/".join(urllib.parse.quote(part) for part in relative.split("/"))
              request = urllib.request.Request(
                  url,
                  data=path.read_bytes(),
                  method="PUT",
                  headers={"Authorization": f"Basic {credential}"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.status not in (200, 201, 204):
                      raise SystemExit(f"Maven upload failed for {relative}: HTTP {response.status}")
              print(f"uploaded Maven file: {relative}")

          finalize = urllib.request.Request(
              "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/sh.hop?publishing_type=automatic",
              data=b"",
              method="POST",
              headers={"Authorization": f"Bearer {credential}"},
          )
          with urllib.request.urlopen(finalize, timeout=120) as response:
              if response.status not in (200, 201, 202, 204):
                  raise SystemExit(f"Maven deployment finalization failed: HTTP {response.status}")
              deployment = response.read().decode("utf-8", "replace").strip()
          print(f"submitted Maven deployment: {deployment or 'accepted'}")
          PY
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/release-manifest.json

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true

# AGP 9 ships a built-in Kotlin integration and a new DSL that are, since AGP 9.0, incompatible with the
# external org.jetbrains.kotlin.multiplatform plugin this module uses (com.android.library + a KMP
# androidTarget). Keep the legacy DSL and external Kotlin compilation so the two coexist, the same bypass
# the repo's AGP 9 Android consumer applies in tools/package-export-smoke.py.
android.builtInKotlin=false
android.newDsl=false

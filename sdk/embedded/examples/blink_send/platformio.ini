; Build the blink_send example against the local Hop library.
;
;   pio run                 # compile for the default board below
;   pio run -e esp32c3      # compile for a RISC-V board
;
; lib_deps points at the library root two directories up so the example builds in place. Consuming Hop
; from the PlatformIO registry instead is a one-liner:
;   lib_deps = hopmesh/Hop

[platformio]
src_dir = .

[env]
platform = platformio/espressif32@7.0.1
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.0
    platformio/tool-scons@4.40801.0
framework = arduino
; Hop links a large static library, so the firmware does not fit the board default partition
; table (default.csv gives the app 1,310,720 bytes). The release build of this example measured
; 1,741,997 bytes and failed with "The program size is greater than maximum allowed". huge_app
; gives the app 3,145,728 bytes. It trades away the second OTA slot, which these examples do not
; use; a real product should pick the table that matches its own flash layout and OTA needs.
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    symlink://../../

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1

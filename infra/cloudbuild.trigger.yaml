# GitOps build + deploy: one Cloud Build run on every push to main (no GitHub
# Actions for deploy, no Spacelift). It builds + pushes both images, WAITS for the
# GitHub CI workflow on this exact commit to be green, then runs `tofu apply` with
# the just-built $SHORT_SHA so Cloud Run rolls to exactly this commit. State lives in
# GCS (gs://hop-mesh-tfstate, see infra/versions.tf): OpenTofu, no HashiCorp/Spacelift
# SaaS. Because the push steps complete BEFORE apply (waitFor), the tag always exists
# when Cloud Run pulls it.
#
# DEPLOY GATE (infra-01 / quality-net-09): the `require-ci` step below blocks `apply`
# until GitHub CI (.github/workflows/ci.yml) reports success for $COMMIT_SHA. A commit
# that fails tests, clippy, the wire-format/header-drift guardrail, or the Terraform
# validate/plan can no longer roll to the fleet. This is the RUNTIME half; the intent
# half (branch protection so a red commit can't reach main at all) must be set in the
# GitHub repo settings, which no file can do: see infra/README.md ("Deploy gate").
substitutions:
  _AR: us-central1-docker.pkg.dev/hop-mesh/hop
  _TOFU: ghcr.io/opentofu/opentofu:1.12.3 # must be >= the version that wrote the state
  # The GitHub repo whose CI status gates the apply.
  _GH_REPO: hopmesh/hop
  # The aggregate anycast name the smoke test probes after a relay-enabled apply. Must match
  # infra/variables.tf `domain` (default relay.hopme.sh); the smoke step hits https://$_DOMAIN/healthz.
  _DOMAIN: relay.hopme.sh
  # Single source of truth for whether the fleet is on. Consumed by BOTH the apply step
  # (TF_VAR_relays_enabled) and the post-apply smoke step (which no-ops when this is false).
  # Flip this one line to true to re-enable the fleet (P2P-only test phase keeps it false).
  _RELAYS_ENABLED: 'false'
  # infra-r2-02 / infra-r2-07 / infra-r2-08: the EXACT set of CI check-runs the deploy gate REQUIRES,
  # one per line. These are the `name:` fields of the jobs in .github/workflows/ci.yml. The gate now
  # asserts EVERY name here concluded `success` for the commit (not merely "no failures among whatever
  # check-runs happened to exist"). Consequences:
  #   - infra-r2-02: a removed/renamed/dropped CI job (typo, YAML error) makes its required name MISSING,
  #     which now fails the gate instead of silently passing on an incomplete matrix.
  #   - infra-r2-07: Pages (pages.yml) check-runs are NOT in this list, so a Pages-only failure on a
  #     web/sim commit no longer blocks the unrelated relay apply.
  #   - infra-r2-08: an all-skipped/neutral matrix no longer counts as green; each required name must
  #     conclude `success` specifically.
  # KEEP IN SYNC with ci.yml job names AND infra/README.md ("Deploy gate + branch protection") AND the
  # branch-protection audit (.github/workflows/branch-protection-audit.yml). The purity of this list is
  # itself asserted in CI (tools/check-required-checks.sh).
  _REQUIRED_CHECKS: |
    Rust (test · clippy · fmt)
    Kotlin SDK tests (BearerManager)
    Android bearers + driver (JVM unit tests)
    Apple bearers + driver + app (build-only)
    WASM sim (wasm32 build + swarm invariants)
    Web + sim (Astro build · scenario-check · link check)
    Contract purity + header drift + C smoke
    Terraform (fmt · validate · plan)
    Docs token guard (banned copy)
    Node endpoint SDK (proofs)
    Python endpoint SDK (proofs)
    Go endpoint SDK (race)
    Ruby endpoint SDK (proofs)
    Crystal endpoint SDK (spec)
    Elixir endpoint SDK (mix test)
    CI gate
steps:
  # infra-07: both image builds start immediately (waitFor ['-']) so the two cold full-workspace Rust
  # release builds run in PARALLEL rather than serially. Cloud Build's default (no waitFor) makes a step
  # wait for ALL prior steps, which chained these two back-to-back inside the total timeout; the biggest
  # apply (re-enabling ~42 regional services in the same run) is exactly when that serial cost hurts.
  - name: gcr.io/cloud-builders/docker
    id: build-relayd
    waitFor: ['-']
    args: [build, -f, services/hop-relayd/Dockerfile, -t, '${_AR}/hop-relayd:$SHORT_SHA', -t, '${_AR}/hop-relayd:latest', .]
  - name: gcr.io/cloud-builders/docker
    id: build-example
    waitFor: ['-']
    args: [build, -f, services/hop-endpoint/Dockerfile, -t, '${_AR}/hop-example:$SHORT_SHA', -t, '${_AR}/hop-example:latest', .]
  # Push explicitly (not via `images:`) so the tags exist in Artifact Registry
  # before the apply step pulls them into Cloud Run.
  - name: gcr.io/cloud-builders/docker
    id: push-relayd
    waitFor: [build-relayd]
    args: [push, --all-tags, '${_AR}/hop-relayd']
  - name: gcr.io/cloud-builders/docker
    id: push-example
    waitFor: [build-example]
    args: [push, --all-tags, '${_AR}/hop-example']
  # DEPLOY GATE (infra-01 / quality-net-09): block apply until GitHub CI is green for THIS commit.
  # Polls the GitHub check-runs API for $COMMIT_SHA and requires EVERY check-run named in
  # $_REQUIRED_CHECKS to have concluded `success`. Fails closed: if a required check is still running
  # it keeps waiting up to the budget; if a required check FAILED, or is MISSING after the budget, or
  # the API is unreachable, it exits non-zero, which aborts the build before `apply` and leaves the
  # fleet on the previous good commit.
  #
  # infra-r2-02: the gate now proves "all required checks ran and passed", not merely "no failures
  # among whatever check-runs happened to exist" - a dropped/renamed job makes its name MISSING and
  # (after the wait) fails the gate. infra-r2-07: check-runs NOT in the allowlist (e.g. the Pages
  # deploy on a web/sim commit) are ignored, so they neither block nor gate the relay apply.
  # infra-r2-08: an all-skipped/neutral matrix no longer passes - each required name must be `success`.
  #
  # Auth: hopmesh/hop is PRIVATE, so the check-runs API MUST be polled with a token. An
  # unauthenticated poll returns 404 (not 403) for a private repo, which the gate reads as "all
  # checks missing" and waits out the whole budget, so the deploy could never converge. The
  # read-only token (Checks:read + Contents/Metadata:read) is mounted as GH_TOKEN via availableSecrets
  # + secretEnv (below); the step sends it as a Bearer. See google_secret_manager_secret.ci_readtoken
  # in infra/cloudbuild_trigger.tf (container is TF-managed; the token value is seeded out-of-band).
  # infra-r3-01: use the gcloud builder, NOT gcr.io/cloud-builders/curl, for this step. The gate needs
  # BOTH curl (poll the API) and python3 (tools/require-ci-verdict.py). The curl builder is a minimal
  # image with no documented python3, so a base-image refresh could drop python3 and break the gate at
  # rc=127 -> '*)' -> exit 1 (fails closed, refuses to deploy, but permanently wedges GitOps deploys
  # once relays_enabled flips back on). The gcloud builder ships both curl and a python3 interpreter, so
  # the gate's two dependencies come from one documented image. A `command -v python3` precheck below
  # still emits a clear, actionable error rather than a bare 127 if either tool is ever missing.
  - name: gcr.io/cloud-builders/gcloud
    id: require-ci
    waitFor: ['-']  # start immediately, in parallel with the image builds
    entrypoint: bash
    env:
      - 'REQUIRED_CHECKS=${_REQUIRED_CHECKS}'
    # GH_TOKEN (read-only, mounted from Secret Manager) authenticates the private-repo check-runs poll.
    secretEnv: ['GH_TOKEN']
    args:
      - -ec
      - |
        command -v python3 >/dev/null 2>&1 || {
          echo "::error:: python3 not found in the require-ci builder image; the deploy gate cannot evaluate CI status"; exit 1; }
        command -v curl >/dev/null 2>&1 || {
          echo "::error:: curl not found in the require-ci builder image; the deploy gate cannot poll the check-runs API"; exit 1; }
        # Shell variables below are escaped with a doubled dollar so Cloud Build passes them to the
        # shell instead of resolving them as build-time substitutions at submit (a bare shell var name
        # is not a valid built-in and hard-fails the build before any step runs). Only genuine
        # substitutions stay single-dollar: COMMIT_SHA (built-in) and _GH_REPO (user substitution).
        # Note: even a shell-comment line inside this block scalar is scanned for substitutions, so keep
        # dollar-name patterns out of these comments too.
        api="https://api.github.com/repos/${_GH_REPO}/commits/$COMMIT_SHA/check-runs?per_page=100"
        auth=()
        [ -n "$${GH_TOKEN:-}" ] && auth=(-H "Authorization: Bearer $$GH_TOKEN")
        deadline=$$(( $$(date +%s) + 1500 ))   # wait up to 25 min for CI to finish
        while :; do
          body=$$(curl -sS "$${auth[@]}" -H "Accept: application/vnd.github+json" "$$api") || {
            echo "::error:: could not reach GitHub check-runs API"; exit 1; }
          # Evaluate the commit's check-runs against the REQUIRED allowlist. tools/require-ci-verdict.py
          # is the single source of truth (also unit-tested by tools/require-ci-gate.test.sh in CI):
          #   exit 0 -> every required check concluded success: proceed to apply
          #   exit 2 -> at least one required check is still pending/missing: keep waiting
          #   exit 1 -> a required check FAILED: refuse to deploy now (no point waiting)
          verdict=$$(printf '%s' "$$body" | REQUIRED="$$REQUIRED_CHECKS" python3 tools/require-ci-verdict.py) && rc=0 || rc=$$?
          case "$$rc" in
            0) echo "GitHub CI is green for $COMMIT_SHA: $$verdict; proceeding to apply"; break ;;
            1) echo "::error:: GitHub CI: $$verdict for $COMMIT_SHA; refusing to deploy"; exit 1 ;;
            2)
              if [ "$$(date +%s)" -ge "$$deadline" ]; then
                echo "::error:: required CI checks not green after the wait budget: $$verdict; refusing to deploy"; exit 1
              fi
              echo "waiting on required CI: $$verdict"; sleep 20 ;;
            *) echo "::error:: unexpected verdict rc=$$rc ($$verdict)"; exit 1 ;;
          esac
        done
  # Apply the fleet. Runs as the build trigger's service account (needs deploy +
  # state-bucket perms, see infra/cloudbuild_trigger.tf). deploy_image_sha pins the
  # relay + example images to this commit. Gated on require-ci above.
  - name: '${_TOFU}'
    id: apply
    waitFor: [push-relayd, push-example, require-ci]
    dir: infra
    entrypoint: sh
    # The fleet's non-default vars, supplied as TF_VAR_* env (terraform.tfvars is
    # gitignored: these mirror what the retired Spacelift stack injected). Auth is
    # the build's own service account via ADC (no GOOGLE_APPLICATION_CREDENTIALS).
    env:
      - 'TF_VAR_project_id=hop-mesh'
      - 'TF_VAR_build_connection_name=hop-github'
      - 'TF_VAR_cloud_run_ingress=INGRESS_TRAFFIC_ALL'
      - 'TF_VAR_max_instances_per_region=1'
      - 'TF_VAR_region_allowlist=[]'
      # Relay fleet OFF for the P2P-only test phase: tears down all regional relay Cloud Run
      # services + their NEGs/backends/IAM. The LB, wildcard cert, DNS, Firestore, and the example
      # endpoint stay up, so flipping _RELAYS_ENABLED (above) to true re-applies the fleet on the SAME
      # anycast IP/cert/DNS. One switch drives both the apply and the post-apply smoke test.
      - 'TF_VAR_relays_enabled=${_RELAYS_ENABLED}'
      - 'TF_VAR_deploy_image_sha=$SHORT_SHA'
    args:
      - -ec
      - |
        tofu init -input=false
        tofu apply -input=false -auto-approve
  # POST-DEPLOY SMOKE TEST (infra: relay re-enable). When the fleet is enabled, prove the relay
  # actually came up before this build is allowed to go green: poll the AGGREGATE anycast health
  # endpoint (https://$_DOMAIN/healthz) and fail the build if it never answers healthy. When the
  # fleet is disabled (_RELAYS_ENABLED != true) there is nothing to bring up, so this is a clean
  # no-op that prints a skip line and exits 0 (the push-to-main = deploy flow is unchanged).
  #
  # Why the aggregate name and not a per-region endpoint: cloud_run.tf and services/hop-relayd
  # forbid EXTERNAL uptime checks against <region>.relay.hopme.sh because a repeated probe wakes
  # scaled-to-zero instances (DESIGN.md §1436). This is NOT that: it is ONE post-deploy probe of the
  # single anycast name a real client dials, which the LB routes to the nearest healthy region. It
  # wakes at most one region once, exactly as a first client connect would, and does not run
  # continuously. serve_healthz returns 200 "ok" (or "ok degraded: ...") only when the driver loop
  # ticked recently, and 503 when a region is wedged, so a 200 here is real liveness, not a bare TCP
  # accept. Cold start after a full re-enable can take a moment (cert/instance warm-up), so retry on
  # a bounded budget before failing closed.
  - name: gcr.io/cloud-builders/gcloud
    id: smoke-relay
    waitFor: [apply]
    entrypoint: bash
    args:
      - -ec
      - |
        if [ "${_RELAYS_ENABLED}" != "true" ]; then
          echo "relays disabled (_RELAYS_ENABLED=${_RELAYS_ENABLED}); skipping relay smoke test"; exit 0
        fi
        # Shell variables escaped with a doubled dollar (see the require-ci step). _DOMAIN and
        # _RELAYS_ENABLED stay single-dollar as genuine substitutions; -w '%{http_code}' is a curl
        # format, not a shell var. Keep dollar-name patterns out of this comment (it is scanned too).
        url="https://${_DOMAIN}/healthz"
        deadline=$$(( $$(date +%s) + 300 ))   # up to 5 min for cert/instance warm-up on a cold re-enable
        attempt=0
        while :; do
          attempt=$$((attempt + 1))
          code=$$(curl -sS -o /tmp/healthz.body -w '%{http_code}' --max-time 15 "$$url" 2>/dev/null || echo 000)
          body=$$(cat /tmp/healthz.body 2>/dev/null || true)
          if [ "$$code" = "200" ]; then
            echo "relay smoke OK: $$url -> $$code ($$body) after $$attempt attempt(s)"; exit 0
          fi
          if [ "$$(date +%s)" -ge "$$deadline" ]; then
            echo "::error:: relay smoke FAILED: $$url did not return healthy within the budget (last code=$$code body=$$body); the fleet did not come up"; exit 1
          fi
          echo "waiting on relay health: $$url -> $$code ($$body); retrying"; sleep 10
        done
# The read-only GitHub token the require-ci gate sends as a Bearer to poll the PRIVATE repo's
# check-runs (see the require-ci step + google_secret_manager_secret.ci_readtoken). Mounted as the
# GH_TOKEN secretEnv; the token value is seeded out-of-band, never in TF state or this file.
availableSecrets:
  secretManager:
    - versionName: projects/hop-mesh/secrets/hop-ci-readtoken/versions/latest
      env: GH_TOKEN
options:
  machineType: E2_HIGHCPU_8
  # Required when the build runs as a user-specified service account (no default
  # Cloud Build logs bucket).
  logging: CLOUD_LOGGING_ONLY
# infra-07: 3600s (was 1800s). The two now-parallel Rust release builds + the require-ci wait (up to
# 1500s) + the apply that, when relays_enabled flips back to true, creates ~42 Cloud Run services +
# NEGs + the whole LB chain, must all fit in one budget. 30 min was a plausible timeout on the exact
# re-enable run that matters most. The Dockerfiles have no cargo/layer cache, so every build is cold;
# adding cargo-chef `--cache-from` layer caching to services/*/Dockerfile is the next lever if this
# still runs long (kept out of this change: it touches services/, a different subtree).
timeout: 3600s

# Manual low-privilege relay image build. _SOURCE_SHA is mandatory and must be the
# full 40-character source revision. This config never publishes a mutable tag.
#
# gcloud builds submit --config infra/cloudbuild.yaml \
#   --substitutions _SOURCE_SHA=<full-sha> .
substitutions:
  _AR: us-central1-docker.pkg.dev/hop-mesh/hop
  _SOURCE_SHA: ''
steps:
  - name: gcr.io/cloud-builders/gcloud@sha256:f0fb55d6de1530ad854762fbaecf4d430ebad070cd2dc190e5061369267abf3b
    id: validate-full-source-sha
    entrypoint: bash
    args:
      - -ec
      - |
        case '${_SOURCE_SHA}' in
          [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
          *) echo '_SOURCE_SHA must be exactly 40 lowercase hexadecimal characters' >&2; exit 1 ;;
        esac
  - name: gcr.io/cloud-builders/docker@sha256:4a33059c95a600582497fac50780c1c4f68388338fb54002a95b99af85b8f651
    id: build-relayd
    waitFor: [validate-full-source-sha]
    args: [build, -f, services/hop-relayd/Dockerfile, -t, '${_AR}/hop-relayd:${_SOURCE_SHA}', .]
images:
  - '${_AR}/hop-relayd:${_SOURCE_SHA}'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
